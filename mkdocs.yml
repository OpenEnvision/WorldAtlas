              - Reprojection Error: benchmark/metrics/reprojection_error.md
              - Depth Accuracy: benchmark/metrics/depth_accuracy.md
              - Depth Collision: benchmark/metrics/depth_collision.md
              - Optical Flow AEPE: benchmark/metrics/optical_flow_aepe.md
          - Physics:
              - Overview:
                  - Physics: benchmark/metrics/dimensions/physics.md
                  - Simulator-Backed Physics: benchmark/metrics/physics/index.md
                  - Physics Workflow: benchmark/metrics/physics/workflow.md
                  - Physics Metrics & Contracts: benchmark/metrics/physics/metrics.md
              - Physical Motion Fidelity: benchmark/metrics/pmf.md
              - Motion Magnitude: benchmark/metrics/motion_magnitude.md
              - Motion Smoothness: benchmark/metrics/motion_smoothness.md
              - Simulator Based Physics Evaluation Metric Groups:
                  - Video Physics: benchmark/metrics/physics/video_physics.md
                  - Geometry 3D: benchmark/metrics/physics/geometry_3d.md
                  - Temporal Consistency: benchmark/metrics/physics/temporal_consistency.md
                  - World 4D: benchmark/metrics/physics/world_4d.md
              - Physics Judge: benchmark/metrics/physics/physics_judge.md
          - Quality:
              - Overview: benchmark/metrics/dimensions/quality.md
              - Style Consistency: benchmark/metrics/style_consistency.md
              - Perceptual Quality: benchmark/metrics/perceptual_quality.md
              - PSNR: benchmark/metrics/psnr.md
              - SSIM: benchmark/metrics/ssim.md
          - Real Time:
              - Overview: benchmark/metrics/dimensions/real_time.md
              - Temporal Calibration: benchmark/metrics/temporal_calibration.md
  - Runtime Setup: thirdparty.md
  - Dataset Analytics:
      - Overview: overview.md
      - Images: images.md
      - Videos: videos.md

site_name: WorldArena
site_description: World model benchmark and dataset analytics toolkit
site_url: https://ichubai.github.io/WorldArena/
site_dir: .cache/site
theme:
  name: material
  language: en
  icon:
    logo: material/chart-arc
  palette:
    - scheme: default
      primary: teal
      accent: amber
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_css:
  - assets/stylesheets/extra.css
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
            Home: 首页
            Architecture: 架构
            Benchmark: 基准评测
            Overview: 总览
            Protocol & Eligibility: 协议与资格
            Workflow & Outputs: 工作流与输出
            Showcase Viewer: Showcase 可视化
            Simulator-Backed Physics: Simulator-Backed Physics
            Physics Workflow: Physics 工作流
            Physics Metrics & Contracts: Physics 指标与契约
            Simulator Based Physics Evaluation Metric Groups: Simulator Based Physics evaluation 指标分组
            Video Physics: 视频物理
            Geometry 3D: 3D 几何
            Temporal Consistency: 时间一致性
            World 4D: 4D 世界
            Physics Judge: Physics Judge
            Metrics: 指标
            Long Sequence (Memory): Long Sequence（Memory）
            Action Control: Action Control
            3D/4D Consistency: 3D/4D 一致性
            Physics: Physics
            Quality: Quality
            Real Time: Real Time
            Prompt Alignment: 提示对齐
            Semantic Alignment: 语义对齐
            Style Consistency: 风格一致性
            Perceptual Quality: 感知质量
            Anchor Consistency: 锚点一致性
            Subject Consistency: 主体一致性
            Background Consistency: 背景一致性
            Camera Error: 相机误差
            Object Detection: 目标检测
            Seen Region Preservation: 已见区域保真
            Novel Region Fidelity: 新显露区域保真
            Object Permanence: 物体持久性
            Reprojection Error: 重投影误差
            Depth Accuracy: 深度准确性
            Depth Collision: 深度碰撞
            MEt3R Consistency: MEt3R 一致性
            Reconstruction Consistency: 重建一致性
            Optical Flow AEPE: 光流 AEPE
            Motion Accuracy: 运动准确性
            Physical Motion Fidelity: 物理运动保真度
            Motion Magnitude: 运动幅度
            Motion Smoothness: 运动平滑度
            Long-Sequence Diagnostics: Long-Sequence 诊断
            Memory Revisit Consistency: 记忆回访一致性
            Trajectory Accuracy: 轨迹准确性
            PSNR: PSNR
            SSIM: SSIM
            Temporal Calibration: 时间校准
            Runtime Setup: 运行时布局
            Dataset Analytics: 数据分析
            Images: 图像
            Videos: 视频
            Captions: Caption
            Collections: 集合明细
            Development: 开发
nav:
  - Home: index.md
  - Architecture: architecture.md
  - Benchmark:
      - Overview: benchmark/index.md
      - Protocol & Eligibility: benchmark/protocol.md
      - Workflow & Outputs: benchmark/workflow.md
      - Showcase Viewer: benchmark/showcase.md
      - Metrics:
          - Overview: benchmark/metrics/index.md
          - Long Sequence (Memory):
              - Overview: benchmark/metrics/dimensions/long_sequence.md
              - Anchor Consistency: benchmark/metrics/anchor_consistency.md
              - Subject Consistency: benchmark/metrics/subject_consistency.md
              - Background Consistency: benchmark/metrics/background_consistency.md
              - Seen Region Preservation: benchmark/metrics/seen_region_preservation.md
              - Object Permanence: benchmark/metrics/object_permanence.md
              - Memory Revisit Consistency: benchmark/metrics/memory_revisit_consistency.md
              - Long-Sequence Diagnostics: benchmark/metrics/long_sequence.md
          - Action Control:
              - Overview: benchmark/metrics/dimensions/action_control.md
              - Prompt Alignment: benchmark/metrics/prompt_alignment.md
              - Semantic Alignment: benchmark/metrics/semantic_alignment.md

site_name: WorldArena
site_description: World model benchmark and dataset analytics toolkit
site_url: https://ichubai.github.io/WorldArena/
site_dir: .cache/site
theme:
  name: material
  language: en
  icon:
    logo: material/chart-arc
  palette:
    - scheme: default
      primary: teal
      accent: amber
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_css:
  - assets/stylesheets/extra.css
nav:
  - Home: index.md
  - Architecture: architecture.md
  - Benchmark:
      - Overview: benchmark/index.md
      - Protocol & Eligibility: benchmark/protocol.md
      - Workflow & Outputs: benchmark/workflow.md
      - Metrics:
          - Overview: benchmark/metrics/index.md
          - Prompt Alignment: benchmark/metrics/prompt_alignment.md
          - Style Consistency: benchmark/metrics/style_consistency.md
          - Perceptual Quality: benchmark/metrics/perceptual_quality.md
          - Reference Appearance Alignment: benchmark/metrics/reference_appearance_alignment.md
          - Anchor Consistency: benchmark/metrics/anchor_consistency.md
          - Camera Error: benchmark/metrics/camera_error.md
          - Object Detection: benchmark/metrics/object_detection.md
          - Reprojection Error: benchmark/metrics/reprojection_error.md
          - Optical Flow AEPE: benchmark/metrics/optical_flow_aepe.md
          - Motion Accuracy: benchmark/metrics/motion_accuracy.md
          - Motion Magnitude: benchmark/metrics/motion_magnitude.md
          - Motion Smoothness: benchmark/metrics/motion_smoothness.md
          - Temporal Calibration: benchmark/metrics/temporal_calibration.md
  - Environment: environment.md
  - Runtime Setup: third_party.md
  - Dataset Analytics:
      - Overview: overview.md
      - Images: images.md
      - Videos: videos.md
      - Captions: captions.md
      - Collections: collections.md
  - Development: development.md

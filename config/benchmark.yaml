      sam2_offload_state_to_cpu: true
    depth_accuracy:
      model_name: depth-anything/Depth-Anything-V2-Small-hf
    depth_collision:
      repo_root: thirdparty/Video-Depth-Anything
      checkpoint_path: ckpt/Video-Depth-Anything/metric_video_depth_anything_vits.pth
      encoder: vits
      depth_threshold: 1.0
      center_crop_ratio: 0.2
      frame_source: sampled
      input_size: 256
    met3r_consistency:
      distance: cosine
      backbone: mast3r
      batch_size: 1
      feature_backbone_weights: ckpt/mhamilton723--FeatUp
    reconstruction_consistency:
      model_name: depth-anything/DA3-GIANT
      repo_root: thirdparty/Depth-Anything-3/src
      scorer: lpips
      lpips_net: alex
      frame_source: sampled
      process_res: 504
      gs_render_size:
      - 512
      - 512
      trj_mode: extend
      chunk_size: 4
    temporal_calibration:
      clip_length: 30
      stride: 4
      resolution: 216
      checkpoint_path: ckpt/Pulse-of-Motion/vc_common_10_60fps.ckpt
    long_sequence:
      amt_checkpoint_path: ckpt/amt_model/amt-s.pth
      raft_model_path: ckpt/raft_model/models/raft-things.pth
      musiq_model_path: ckpt/musiq/musiq_spaq_ckpt-358bb6af.pth
      bg_clip2clip_feat_extractor: clip
    memory_revisit_consistency:
      mse_tau: 0.08
      progress_lower: 0.03
      progress_upper: 0.18
      progress_gate_weight: 0.35
      closure_weights:
        dino: 0.55
        ssim: 0.25
        mse: 0.20

paths:
  image_root: /bench-workspace/yesliu/hjd/data/image
  video_root: /bench-workspace/yesliu/hjd/data/videos
  inventory_dir: artifacts/benchmark/inventory
  manifest_dir: artifacts/benchmark/manifest
  reports_dir: artifacts/benchmark/reports
  cache_dir: .cache/worldarena/benchmark

benchmark:
  snapshot_name: worldarena_freeze_candidate
  target_fps: 24
  anchor_positions: [0.0, 0.3333, 0.6667, 1.0]
  motion_frame_count: 12
  protocol:
    official: segment_random
    compatibility: anchor_compat
    seed: 17
    segment_count: 4
  split_ratios:
    dev_public: 0.2
    dev_private: 0.1
    test_hidden: 0.7
  planned_counts: {}
  metrics_by_suite:
    image_static:
      - prompt_alignment
      - style_consistency
      - perceptual_quality
    image_dynamic:
      - prompt_alignment
      - style_consistency
      - perceptual_quality
    video_static:
      - prompt_alignment
      - style_consistency
      - perceptual_quality
    video_dynamic:
      - prompt_alignment
      - style_consistency
      - perceptual_quality
      - motion_magnitude
      - motion_smoothness
    auxiliary:
      - reference_appearance_alignment
      - anchor_consistency
    experimental:
      - reference_appearance_alignment
      - anchor_consistency
      - motion_magnitude
      - motion_smoothness
  metric_backends:
    prompt_alignment: reference
    reference_appearance_alignment: clip
    style_consistency: reference
    perceptual_quality: reference
    motion_magnitude: farneback
    motion_smoothness: farneback
    anchor_consistency: clip
  normalization:
    prompt_alignment:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    reference_appearance_alignment:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    style_consistency:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    perceptual_quality:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    motion_magnitude:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
      tau_log_ratio: 0.35
    motion_smoothness:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
      tau_log_ratio: 0.5
    anchor_consistency:
      lower: 0.0
      upper: 1.0
      higher_is_better: true

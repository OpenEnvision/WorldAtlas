paths:
  image_root: data/image
  video_root: data/video
  inventory_dir: artifacts/benchmark/inventory
  manifest_dir: artifacts/benchmark/manifest
  predictions_dir: artifacts/predictions
  reports_dir: artifacts/benchmark/reports
  cache_dir: .cache/worldatlas/benchmark
benchmark:
  # Filename IDs alone do not prove which image generated a legacy video.
  require_verified_image_bindings: true
  snapshot_name: worldatlas_freeze_candidate
  target_fps: 24
  anchor_positions:
  - 0.0
  - 0.3333
  - 0.6667
  - 1.0
  motion_frame_count: 12
  dynamic_prefix_ratio: 0.25
  dynamic_prefix_min_frames: 4
  protocol:
    official: segment_random
    compatibility: anchor_compat
    seed: 17
    segment_count: 4
  # Fixed real-video distribution for the suite-level distribution metrics.
  # Static predictions are additionally scored per (style, environment) stratum;
  # dynamic assets carry no environment label and stay unstratified.
  reference_corpus:
    enabled: true
    root: data/video
    index_path: artifacts/benchmark/inventory/reference_corpus_index.json
    cache_dir: .cache/worldatlas/distribution_reference
    max_videos_per_group: null
    seed: 17
    stratified: true
    # JEDi default. FVMD overrides these in metric_runtime.fvmd because a
    # 1024-d Frechet covariance is singular below 1025 windows.
    min_prediction_clips: 64
    min_reference_clips: 64
  planned_counts: {}
  # Distribution metrics score against benchmark.reference_corpus rather than each
  # sample's own ground truth, so image-conditioned suites carry them too.
  metrics_by_suite:
    image_static:
    - prompt_alignment
    - style_consistency
    - image_quality
    - hpsv3_norm
    - perceptual_quality
    - brightness_distribution_consistency
    - color_temperature_constraint
    - sharpness_retention
    - temporal_flickering
    - background_consistency
    - camera_error
    - met3r_consistency
    - reprojection_error
    - optical_flow_aepe
    - epipolar_error
    - epipolar_inlier_rate
    - feature_match_coverage
    - jedi
    - geometric_consistency
    - photometric_consistency
    image_dynamic:
    - prompt_alignment
    - style_consistency
    - image_quality
    - hpsv3_norm
    - perceptual_quality
    - brightness_distribution_consistency
    - color_temperature_constraint
    - sharpness_retention
    - temporal_flickering
    - fvmd
    - jedi
    - trajan
    - motion_accuracy
    - motion_magnitude
    - motion_smoothness
    - optical_flow_aepe
    - physical_fps_error
    - physical_fps_pct_error
    - physical_fps_intra_video_cv
    video_static:
    - prompt_alignment
    - style_consistency
    - image_quality
    - hpsv3_norm
    - perceptual_quality
    - brightness_distribution_consistency
    - color_temperature_constraint
    - sharpness_retention
    - temporal_flickering
    - background_consistency
    - camera_error
    - met3r_consistency
    - reprojection_error
    - optical_flow_aepe
    - jedi
    - epipolar_error
    - epipolar_inlier_rate
    - feature_match_coverage
    - keystroke_strict_action_accuracy
    - keystroke_partial_action_accuracy
    - keystroke_traj_score
    - keystroke_natet
    - keystroke_nater
    - rollout_aesthetic_drift
    - rollout_imaging_drift
    - geometric_consistency
    - photometric_consistency
    video_dynamic:
    - prompt_alignment
    - style_consistency
    - image_quality
    - hpsv3_norm
    - perceptual_quality
    - brightness_distribution_consistency
    - color_temperature_constraint
    - sharpness_retention
    - temporal_flickering
    - background_consistency
    - fvmd
    - jedi
    - trajan
    - motion_accuracy
    - motion_magnitude
    - motion_smoothness
    - met3r_consistency
    - epipolar_error
    - epipolar_inlier_rate
    - feature_match_coverage
    - keystroke_strict_action_accuracy
    - keystroke_partial_action_accuracy
    - keystroke_traj_score
    - keystroke_natet

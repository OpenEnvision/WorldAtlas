    - physical_fps_error
    - met3r_consistency
    - memory_symmetry
    - keystroke_strict_action_accuracy
    - keystroke_partial_action_accuracy
    - keystroke_traj_score
    - keystroke_natet
    - keystroke_nater
    - rollout_aesthetic_drift
    - rollout_imaging_drift
    - scene_memory_f1
  metric_backends:
    prompt_alignment: reference
    style_consistency: gram_matrix
    perceptual_quality: reference
    image_quality: musiq
    hpsv3_norm: hpsv3
    brightness_consistency: luminance_temporal
    brightness_distribution_consistency: distribution
    color_temperature_consistency: hsv_hue_drift
    color_temperature_constraint: hue_distribution
    sharpness_retention: tenengrad_brisque
    sharpness_vector_retention: tenengrad_vector
    temporal_flickering: pixel_mae
    background_consistency: clip_vit_b32
    segment_continuity: transnet_v2
    camera_error: megasam
    fvmd: fvmd
    jedi: jedi
    trajan: trajan
    reprojection_error: droid_slam
    optical_flow_aepe: sea_raft
    epipolar_error: opencv_epipolar
    epipolar_inlier_rate: opencv_epipolar
    feature_match_coverage: opencv_epipolar
    motion_accuracy: sam2_sea_raft
    motion_magnitude: sea_raft
    motion_smoothness: vfi_mamba
    physical_fps_error: pulse_of_motion
    physical_fps_pct_error: pulse_of_motion
    physical_fps_intra_video_cv: pulse_of_motion
    met3r_consistency: met3r
    reconstruction_consistency: da3_reprojection
    geometric_consistency: da3_reprojection
    photometric_consistency: da3_reprojection
    long_sequence_motion_smoothness: long_sequence
    long_sequence_dynamic_degree: long_sequence
    long_sequence_aesthetic_quality: long_sequence
    long_sequence_imaging_quality: long_sequence
    keystroke_strict_action_accuracy: pose_action
    keystroke_partial_action_accuracy: pose_action
    keystroke_traj_score: pose_action
    keystroke_natet: pose_action
    keystroke_nater: pose_action
    rollout_aesthetic_drift: quality_drift
    rollout_imaging_drift: quality_drift
    scene_memory_f1: point_cloud_f1
    memory_revisit_consistency: dinov2
    revisit_return_gate: pose_gate
    entity_reappearance_consistency: masked_dinov2
    memory_symmetry: mse_symmetry
    memory_return_gate: pose_loop_gate
    memory_scene_f1: point_cloud_f1
    memory_revisit_fidelity: pose_aligned_dino
    memory_geometric_closure: sift_epipolar
    memory_rendering_recovery: cielab_gram
    memory_half_life: exponential_fit
  metric_runtime:
    official_source:
    motion_accuracy:
      sam2_offload_video_to_cpu: true
      sam2_offload_state_to_cpu: true
    hpsv3_norm:
      p1: 5.21
      p99: 8.66
      sample_count: 20
      # One forward per video on H100/H800 80GB. Override with WORLDATLAS_HPSV3_BATCH_SIZE.
      batch_size: 20
      prompt_mode: empty
    camera_error:
      camera_gt_policy: native_intended
      droid_intrinsics: actual_resolution
      megasam_output_root: .cache/benchmark/megasam_camera_error
      megasam_skip_existing: true
      megasam_unidepth_cpu_fallback: true
    optical_flow_aepe:
      # Spring-M is 960 after the metric's 0.5 scale; cap source at 1920 so
      # correlation volumes stay inside 80GB. Pair batch fills leftover VRAM.
      cache_instance: true
      frame_max_side: 1920
      batch_size: 2
    motion_magnitude:
      # Shared across models. Flow vectors are restored to source pixel units.
      frame_max_side: 1920
    brightness_consistency:
      absolute_tau: 0.20
      relative_tau: 0.35
      min_luminance: 0.02
    brightness_distribution_consistency:
      dark_threshold: 85
      bright_threshold: 170
      temporal_decay: 0.05
      softmax_lambda: 4.0
    color_temperature_consistency:
      hue_tau: 0.12
      saturation_power: 1.0
      min_saturation_weight: 0.0001
    color_temperature_constraint:
      hue_bins: 7
      temporal_decay: 0.10
      softmax_lambda: 4.0
    sharpness_retention:
      baseline_frame_count: 2
      texture_floor: 0.00001
      brisque_good: 30.0
      brisque_bad: 80.0
    sharpness_vector_retention:
      log_factor: 12.0
      temporal_decay: 0.05
    segment_continuity:
      threshold: 0.5
      min_scene_len: 10
    gvgc_geometry:
      feature_detector: sift
      opencv_num_threads: 1
      opencv_rng_seed: 17
      max_features: 2000
      ratio_test: 0.75
      min_matches: 12
      max_analysis_width: 640
      ransac_reproj_threshold: 1.0
      ransac_confidence: 0.999
      ransac_max_iters: 10000
      pair_stride: 1
      max_pairs: 8
      fallback_enabled: true
      fallback_feature_detector: sift
      fallback_ratio_test: 0.85
      fallback_min_matches: 8
      tracking_fallback_enabled: true
      tracking_min_matches: 8
      tracking_quality_level: 0.001
      tracking_min_distance: 3.0
      tracking_block_size: 3
      tracking_window_size: 21
      tracking_max_level: 3
      tracking_max_iterations: 30
      tracking_epsilon: 0.01
      tracking_forward_backward_max_error: 1.5
    met3r_consistency:
      protocol: met3r_paper_consecutive_symmetric_v1
      distance: cosine
      backbone: dust3r
      batch_size: 1
      feature_backbone: dino16
      upsampler: featup
      use_norm: true
      freeze: true
      direction: symmetric
      frame_source: native_consecutive
      img_size: null  # Rasterization follows the aspect-preserving input dimensions.
    reconstruction_consistency:
      model_name: depth-anything/DA3-GIANT-1.1
      repo_root: thirdparty/Depth-Anything-3/src
      frame_source: wbench_fps
      fps: 3.0
      decode_threads: 16
      decode_mode: sequential_exact
      process_res: 504
      max_pts_per_frame: 5000
      use_confidence_mask: false
      conf_threshold: 0.5
    temporal_calibration:
      clip_length: 30
      stride: 4
      resolution: 216
      checkpoint_path: ckpt/Pulse-of-Motion/vc_common_10_60fps.ckpt
      batch_size: 16
      short_video_policy: temporal_resample
      short_video_min_segments: 5
      disk_cache: true
      cache_dir: .cache/benchmark/pulse_of_motion_results_batch16
    long_sequence:
      amt_checkpoint_path: ckpt/amt_model/amt-s.pth
      raft_model_path: ckpt/raft_model/models/raft-things.pth
      musiq_model_path: ckpt/musiq/musiq_spaq_ckpt-358bb6af.pth
    long_horizon_diagnostics:
      # Fixed, model-independent rates. These preserve the old minimum settings
      # at an explicit 30 FPS reference; they are NOT calibrated physical units.
      move_speed_threshold: 0.06
      rotation_speed_threshold: 6.0
      action_threshold_calibration: uncalibrated_legacy_30fps_reference
      min_path_length: 0.5
      min_rotation_degrees: 10.0
      segment_count: 10
      max_frames: 300
      musiq_model_path: ckpt/musiq/musiq_spaq_ckpt-358bb6af.pth
      imaging_quality_preprocessing_mode: longer
      distance_threshold_ratio: 0.02
      voxel_size: 0.0
      centroid_align: true
      max_frames_per_segment: 8
      max_points_per_frame: 4096
    memory_revisit_consistency:
      mse_tau: 0.08
      progress_lower: 0.03
      progress_upper: 0.18
      progress_gate_weight: 0.35
      require_return_gate: true
      return_tail_fraction: 0.15
      min_departure_translation: 0.10
      min_departure_rotation_degrees: 45.0
      max_return_translation_ratio: 0.12
      max_return_rotation_degrees: 8.0
      closure_weights:
        dino: 0.55
        ssim: 0.25
        mse: 0.20
    revisit_return_gate:
      return_tail_fraction: 0.15
      min_departure_translation: 0.10
      min_departure_rotation_degrees: 45.0
      max_return_translation_ratio: 0.12
      max_return_rotation_degrees: 8.0
    entity_reappearance_consistency:
      appearance_weight: 0.80
      return_tail_fraction: 0.15
      min_departure_translation: 0.10
      min_departure_rotation_degrees: 45.0
      max_return_translation_ratio: 0.12
      max_return_rotation_degrees: 8.0
    scene_memory_f1:
      alignment: trimmed_icp
      centroid_align: false
      icp_trim_fraction: 0.80
      icp_max_iterations: 20
      icp_tolerance: 0.00001
      icp_max_translation_ratio: 0.10
      icp_max_rotation_degrees: 10.0
      require_return_gate: true
      return_tail_fraction: 0.15
      min_departure_translation: 0.10
      min_departure_rotation_degrees: 45.0
      max_return_translation_ratio: 0.12
      max_return_rotation_degrees: 8.0
    memory_symmetry:
      mse_offset: 0.0
      value_decay: 12.0
      exp_power: 1.0
      temporal_decay: 0.20
    # Shared by every closed-loop memory metric. Keeping the pairing knobs in one block
    # means the five metrics hit the same cached rollout analysis instead of recomputing
    # pose matching and feature extraction once each.
    memory_loop:
      alignment: trimmed_icp
      centroid_align: false
      icp_trim_fraction: 0.80
      icp_max_iterations: 20
      icp_tolerance: 0.00001
      icp_max_translation_ratio: 0.10
      icp_max_rotation_degrees: 10.0
      distance_threshold_ratio: 0.02
      max_frames_per_segment: 8
      max_points_per_frame: 4096
      max_pair_distance: 0.15
      min_gap_seconds: 1.0
      rotation_weight: 1.0
      min_departure_factor: 3.0
      min_excursion_factor: 3.0
      max_scored_pairs: 24
      min_sift_matches: 12
      epipolar_tau_pixels: 4.0
      reprojection_tau_pixels: 8.0
      lightness_tau: 6.0
      chroma_tau: 8.0
      gram_tau: 0.002
      half_life_min_points: 5
      half_life_min_r_squared: 0.3
      half_life_reference_seconds: 60.0
    # sample_fps pins both sides to the same wall-clock window. FVMD features are
    # per-frame pixel displacements, so comparing a 30 fps reference against a
    # 16 fps prediction would report the frame rate gap as a motion difference.
    fvmd:
      repo_root: thirdparty/FVMD-frechet-video-motion-distance
      clip_frame_count: 16
      sample_fps: 8
      analysis_size: 256
      max_clips_per_video: 4
      min_clip_count: 2
      # The motion histogram is 1024-dimensional and the Frechet distance
      # estimates a full covariance, so each side needs more than 1024 windows to
      # avoid a singular estimate. The dynamic corpus only holds ~961 videos.
      # image_dynamic has 1628 samples, so 1628 * 4 clears this floor; a small
      # subset run is recorded as not_applicable instead of a biased score.
      min_prediction_clips: 1025
      min_reference_clips: 1025
      reference:
        max_clips_per_video: 4
    jedi:
      repo_root: thirdparty/JEDi
      model_dir: ckpt/JEDi
      config_path: configs/vith16_ssv2_16x2x3.yaml
      clip_frame_count: 16
      sample_fps: 8
      analysis_size: 224
      max_clips_per_video: 1
      min_clip_count: 2
      reference:
        max_clips_per_video: 2
      batch_size: 4
    trajan:
      repo_root: thirdparty/tapnet
      tracker_checkpoint: ckpt/TRAJAN/bootstapir_checkpoint_v2.npy
      autoencoder_checkpoint: ckpt/TRAJAN/track_autoencoder_ckpt.npz
      tracker_model_type: bootstapir
      analysis_size: 256
      max_frames: 150
      support_track_count: 2048
      target_track_count: 2048
      tracker_query_chunk_size: 32
      decoder_chunk_size: 32
      seed: 17
  normalization:
    prompt_alignment:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    memory_revisit_consistency:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    revisit_return_gate:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    entity_reappearance_consistency:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    memory_symmetry:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    memory_return_gate:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    memory_scene_f1:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    memory_revisit_fidelity:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    memory_geometric_closure:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    memory_rendering_recovery:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    memory_half_life:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    style_consistency:
      # Compatibility report scale: 1 / (1 + d / error_ref).
      # Leaderboard uses mean(clip(1 - per-video raw / 0.007)) directly.
      # Raw remains clamped to [0, 0.007] in the metric before normalization.
      error_ref: 0.0004
      error_from: raw
      higher_is_better: false
    perceptual_quality:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    image_quality:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    hpsv3_norm:
      # Frozen display stretch of the official [p1=5.21, p99=8.66] score.
      # Raw remains clip((reward - p1) / (p99 - p1)); only the published
      # [0, 1] value is restretched so generated-video scores are not glued to 0.
      # Reports retain per-sample normalized values. The official leaderboard
      # applies this stretch AFTER mean(raw), through leaderboard_hpsv3_scoring_v1.json.
      lower: -0.20
      upper: 0.55
      higher_is_better: true
    brightness_consistency:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    brightness_distribution_consistency:
      # Frozen display scale: score = 1 / (1 + (1 - raw) / error_ref).
      error_ref: 0.08
      error_from: complement
      higher_is_better: true
    color_temperature_consistency:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    color_temperature_constraint:
      # Frozen display scale: score = 1 / (1 + (1 - raw) / error_ref).
      error_ref: 0.08
      error_from: complement
      higher_is_better: true
    sharpness_retention:
      # Frozen display scale: score = 1 / (1 + (1 - raw) / error_ref).
      error_ref: 0.20
      error_from: complement
      higher_is_better: true
    sharpness_vector_retention:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    temporal_flickering:
      # Frozen display scale: score = 1 / (1 + (1 - raw) / error_ref).
      error_ref: 0.12
      error_from: complement
      higher_is_better: true
    background_consistency:
      # Frozen display scale: score = 1 / (1 + (1 - raw) / error_ref).
      error_ref: 0.03
      error_from: complement
      higher_is_better: true
    segment_continuity:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    motion_magnitude:
      avg: 3.2425
      std: 3.4505
      z_max: 2.7498
      z_min: -0.8638
      range:
      - 0.25
      - 0.75
      higher_is_better: true
    motion_smoothness:
      # Recalibrate the MSE bounds on v2_float32_mse reports before publishing
      # corrected normalized scores; the retained values predate that fix.
      empirical_min:
      - 0.0
      - 0.9224
      - 0.0
      empirical_max:
      - 82.4014
      - 1.0
      - 0.0228
      higher_is_better:
      - false
      - true
      - false
      reducer: arithmetic_mean
    camera_error:
      # Revalidate these direct-GT bounds on sim3_v1 reports. The default
      # native_intended ignores the component bounds. Reports retain error_ref
      # for compatibility; leaderboard publication averages native_intent_accuracy.
      empirical_min:
      - 0.0
      - 0.0
      empirical_max:
      - 15.0
      - 0.5
      higher_is_better:
      - false
      - false
      reducer: geometric_mean
      error_ref: 0.30
      error_from: complement
    fvmd:
      # Compatibility mapping in evaluation reports. Leaderboard publication
      # maps raw distances with config/leaderboard_fvmd.yaml (soft low-score tail).
      # Never recover raw distances from these clipped normalized values.
      lower: 0.0
      upper: 10000.0
      higher_is_better: false
    jedi:
      # Real-vs-real floors on the same corpus, 200 videos/half, already *100:
      # dynamic 0.096; static strata 0.037-0.078; static union 0.057. Keep the
      # paper-scale ceiling of 100 until model-side scores exist to tighten it.
      lower: 0.0
      upper: 100.0
      higher_is_better: false
    trajan:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    reprojection_error:
      empirical_min: 0.0
      empirical_max: 1.0719
      higher_is_better: false
    optical_flow_aepe:
      # Compatibility report scale: 1 / (1 + aepe / error_ref).
      # Leaderboard uses mean(clip(1 - per-video raw / 1.192)); never invert a mean.
      empirical_min: 0.0
      empirical_max: 1.192
      higher_is_better: false
      error_ref: 0.20
      error_from: raw
    epipolar_error:
      # Frozen display scale on raw Sampson px: score = 1 / (1 + px / error_ref).
      error_ref: 0.20
      error_from: raw
      higher_is_better: false
    epipolar_inlier_rate:
      # Frozen display scale: score = 1 / (1 + (1 - raw) / error_ref).
      error_ref: 0.08
      error_from: complement
      higher_is_better: true
    feature_match_coverage:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    motion_accuracy:
      avg: -0.1965
      std: 2.3687
      z_max: 1.518
      z_min: -1.6147
      range:
      - 0.25
      - 0.75
      higher_is_better: true
    met3r_consistency:
      # Paper raw stays [0, 2] lower-is-better. Identity display is 1 - raw/2.
      # Compatibility report scale: 1 / (1 + raw / error_ref).
      # Leaderboard publication directly averages clip(1 - per-video raw / 2).
      lower: 0.0
      upper: 2.0
      higher_is_better: false
      error_ref: 0.30
      error_from: raw
    reconstruction_consistency:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    geometric_consistency:
      # Raw remains 1/(1+e). Recover e = (1-raw)/raw, then score = 1/(1+e/error_ref).
      error_ref: 0.03
      error_from: one_plus_inverse
      higher_is_better: true
    photometric_consistency:

paths:
  image_root: /bench-workspace/yesliu/hjd/data/image
  video_root: /bench-workspace/yesliu/hjd/data/videos
  inventory_dir: artifacts/benchmark/inventory
  manifest_dir: artifacts/benchmark/manifest
  reports_dir: artifacts/benchmark/reports
  cache_dir: .cache/worldarena/benchmark

benchmark:
  snapshot_name: worldarena_freeze_candidate
  target_fps: 24
  anchor_positions: [0.0, 0.3333, 0.6667, 1.0]
  motion_frame_count: 12
  protocol:
    official: segment_random
    compatibility: anchor_compat
    seed: 17
    segment_count: 4
  split_ratios:
    dev_public: 0.2
    dev_private: 0.1
    test_hidden: 0.7
  planned_counts: {}
  metrics_by_suite:
    image_static:
      - prompt_alignment
      - style_consistency
      - perceptual_quality
    image_dynamic:
      - prompt_alignment
      - style_consistency
      - perceptual_quality
    video_static:
      - prompt_alignment
      - style_consistency
      - perceptual_quality
      - camera_error
      - object_detection
      - reprojection_error
      - optical_flow_aepe
    video_dynamic:
      - prompt_alignment
      - style_consistency
      - perceptual_quality
      - motion_accuracy
      - motion_magnitude
      - motion_smoothness
    auxiliary:
      - reference_appearance_alignment
      - anchor_consistency
    experimental:
      - reference_appearance_alignment
      - anchor_consistency
      - motion_magnitude
      - motion_smoothness
  metric_backends:
    prompt_alignment: reference
    reference_appearance_alignment: clip
    style_consistency: reference
    perceptual_quality: reference
    camera_error: droid_slam
    object_detection: grounding_dino
    reprojection_error: droid_slam
    optical_flow_aepe: sea_raft
    motion_accuracy: sam2_sea_raft
    motion_magnitude: sea_raft
    motion_smoothness: vfi_mamba
    anchor_consistency: clip
  normalization:
    prompt_alignment:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    reference_appearance_alignment:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    style_consistency:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    perceptual_quality:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    motion_magnitude:
      avg: 3.2425
      std: 3.4505
      z_max: 2.7498
      z_min: -0.8638
      range: [0.25, 0.75]
      higher_is_better: true
    motion_smoothness:
      empirical_min: [0.0, 0.9224, 0.0]
      empirical_max: [82.4014, 1.0, 0.0228]
      higher_is_better: [false, true, false]
      reducer: arithmetic_mean
    camera_error:
      empirical_min: [0.0, 0.0]
      empirical_max: [15.0, 0.5]
      higher_is_better: [false, false]
      reducer: geometric_mean
    object_detection:
      empirical_min: 0.0
      empirical_max: 1.0
      higher_is_better: true
    reprojection_error:
      empirical_min: 0.0
      empirical_max: 1.0719
      higher_is_better: false
    optical_flow_aepe:
      empirical_min: 0.0
      empirical_max: 1.192
      higher_is_better: false
    motion_accuracy:
      avg: -0.1965
      std: 2.3687
      z_max: 1.518
      z_min: -1.6147
      range: [0.25, 0.75]
      higher_is_better: true
    anchor_consistency:
      lower: 0.0
      upper: 1.0
      higher_is_better: true

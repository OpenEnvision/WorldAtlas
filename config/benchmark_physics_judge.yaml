paths:
  image_root: data/physics/first_frame
  video_root: data/physics/videos_by_category
  inventory_dir: artifacts/benchmark/physics_judge/inventory
  manifest_dir: artifacts/benchmark/physics_judge/manifest
  reports_dir: artifacts/benchmark/physics_judge/reports
  cache_dir: .cache/worldarena/benchmark_physics_judge

benchmark:
  snapshot_name: worldarena_physics_judge
  target_fps: 24
  anchor_positions: [0.0, 0.3333, 0.6667, 1.0]
  motion_frame_count: 12
  protocol:
    official: segment_random
    compatibility: anchor_compat
    seed: 17
    segment_count: 4
  metrics_by_suite:
    experimental:
      - physics_judge_overall
      - physics_judge_phenomenon
      - physics_judge_causality
      - physics_judge_material
      - physics_judge_temporal
      - physics_judge_prompt
  metric_backends:
    physics_judge_overall: openai_judge
    physics_judge_phenomenon: openai_judge
    physics_judge_causality: openai_judge
    physics_judge_material: openai_judge
    physics_judge_temporal: openai_judge
    physics_judge_prompt: openai_judge
  normalization:
    physics_judge_overall:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    physics_judge_phenomenon:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    physics_judge_causality:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    physics_judge_material:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    physics_judge_temporal:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    physics_judge_prompt:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
  metric_runtime:
    physics_judge:
      default_backend: openai_judge
      model: gpt-4.1
      api_key_env: OPENAI_API_KEY
      frame_limit: 6
      reference_frame_limit: 4
      max_side: 768
      jpeg_quality: 85
      detail: low
      temperature: 0.0
      max_output_tokens: 800
      timeout_seconds: 120
      use_reference: true
      cache_dir: .cache/worldarena/physics_judge

paths:
  artifacts_dir: artifacts/dataset_stats
  docs_generated_dir: docs/generated
  docs_data_dir: docs/generated/data
  cache_path: .cache/worldarena/media_probe_cache.json

collections:
  - name: static_images
    scanner: static_image
    modality: image
    group: benchmark
    root: data/image/static
    description: Static image benchmark set grouped by style, environment, and scene.
    exclude_dir_prefixes: [".", "_backup"]

  - name: dynamic_images
    scanner: dynamic_image
    modality: image
    group: benchmark
    root: data/image/dynamic
    description: Dynamic image benchmark set with motion-type masks.
    exclude_dir_prefixes: [".", "_backup"]

  - name: static_videos
    scanner: static_video
    modality: video
    group: benchmark
    root: data/video/static
    description: Static video benchmark grouped by style, environment, scene, and duration bucket.
    exclude_dir_prefixes: [".", "_backup"]

  - name: dynamic_videos
    scanner: dynamic_video
    modality: video
    group: benchmark
    root: data/video/dynamic
    description: Dynamic video benchmark with motion classes, annotations, and optional masks.
    exclude_dir_prefixes: [".", "_backup"]

  - name: aaa_games
    scanner: aaa_games
    modality: video
    group: benchmark
    root: data/video/AAA_Games
    description: AAA game footage subset with SpatialVID-style annotations.
    exclude_dir_prefixes: [".", "_backup"]

  - name: physics_videos
    scanner: physics_video
    modality: physics
    group: benchmark
    root: data/physics
    description: Physics benchmark videos grouped by physics family and dimension.
    exclude_dir_prefixes: [".", "_backup"]

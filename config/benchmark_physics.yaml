paths:
  image_root: /bench-workspace/yesliu/hjd/data/image_test_balanced_5000
  video_root: /bench-workspace/yesliu/hjd/data/videos
  inventory_dir: artifacts/benchmark/physics/inventory
  manifest_dir: artifacts/benchmark/physics/manifest
  reports_dir: artifacts/benchmark/physics/reports
  cache_dir: .cache/worldarena/benchmark_physics

benchmark:
  snapshot_name: worldarena_physics
  target_fps: 24
  anchor_positions: [0.0, 0.3333, 0.6667, 1.0]
  motion_frame_count: 12
  protocol:
    official: segment_random
    compatibility: anchor_compat
    seed: 17
    segment_count: 4
  metrics_by_suite:
    experimental:
      - mse
      - st_iou
      - s_iou
      - ws_iou
      - abs_rel
      - rmse
      - delta1
      - delta2
      - delta3
      - depth_warp_l1
      - depth_warp_charb
      - rgb_warp_charb
      - epe
      - fl_all
      - one_px_out
      - chamfer_4d
      - worldline_l2_error
      - worldline_mean_drift
      - worldline_final_drift
      - worldline_fail_rate
      - worldline_length
  metric_backends:
    mse: simulator_reference
    st_iou: simulator_reference
    s_iou: simulator_reference
    ws_iou: simulator_reference
    abs_rel: simulator_reference
    rmse: simulator_reference
    delta1: simulator_reference
    delta2: simulator_reference
    delta3: simulator_reference
    depth_warp_l1: simulator_reference
    depth_warp_charb: simulator_reference
    rgb_warp_charb: simulator_reference
    epe: simulator_reference
    fl_all: simulator_reference
    one_px_out: simulator_reference
    chamfer_4d: simulator_reference
    worldline_l2_error: simulator_reference
    worldline_mean_drift: simulator_reference
    worldline_final_drift: simulator_reference
    worldline_fail_rate: simulator_reference
    worldline_length: simulator_reference
  normalization:
    mse:
      lower: 0.0
      upper: 0.25
      higher_is_better: false
    st_iou:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    s_iou:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    ws_iou:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    abs_rel:
      lower: 0.0
      upper: 1.0
      higher_is_better: false
    rmse:
      lower: 0.0
      upper: 5.0
      higher_is_better: false
    delta1:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    delta2:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    delta3:
      lower: 0.0
      upper: 1.0
      higher_is_better: true
    depth_warp_l1:
      lower: 0.0
      upper: 1.0
      higher_is_better: false
    depth_warp_charb:
      lower: 0.0
      upper: 1.0
      higher_is_better: false
    rgb_warp_charb:
      lower: 0.0
      upper: 0.5
      higher_is_better: false
    epe:
      lower: 0.0
      upper: 10.0
      higher_is_better: false
    fl_all:
      lower: 0.0
      upper: 1.0
      higher_is_better: false
    one_px_out:
      lower: 0.0
      upper: 1.0
      higher_is_better: false
    chamfer_4d:
      lower: 0.0
      upper: 1.0
      higher_is_better: false
    worldline_l2_error:
      lower: 0.0
      upper: 1.0
      higher_is_better: false
    worldline_mean_drift:
      lower: 0.0
      upper: 1.0
      higher_is_better: false
    worldline_final_drift:
      lower: 0.0
      upper: 1.0
      higher_is_better: false
    worldline_fail_rate:
      lower: 0.0
      upper: 1.0
      higher_is_better: false
    worldline_length:
      lower: 0.0
      upper: 1.0
      higher_is_better: true

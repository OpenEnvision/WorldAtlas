model:
  name: yume-1.5
  family: yume_1_5
  backend_type: local_repo
  task_families: [world_model, video_generation]
  artifact_types: [video]
  control_signals: [text, image]
  roles: [candidate]
  # YUME's published environment targets Python 3.10 with a dedicated CUDA stack.
  # Place the upstream repo under thirdparty/ after preparing the conda environment externally.
  repo_root: thirdparty/YUME
  python_bin: /share/project/yesliu/miniconda3/envs/yume/bin/python
  # Point this at the published Yume-5B checkpoint tree.
  checkpoint_dir: /share/project/yesliu/hjd/model/tmp/YUME/Yume-5B-720P
  # The adapter imports the upstream webapp entrypoint directly instead of launching its HTTP server.
  entrypoint: webapp_single_gpu.py
  output_ext: .mp4
  supported_suites:
    - image_static
    - image_dynamic
    - video_static
    - video_dynamic
  prompt_mode: prompt_target
  reference_mode: first_frame
  generation:
    mode: I2V
    fps: 16
    sample_steps: 4
    sample5b_repo_root: /share/project/yesliu/hjd/model/tmp/YUME
    sample5b_caption_path: /share/project/yesliu/hjd/model/WorldArena/tmp/yume_sample5b_dataset_prompt_caption.txt
    # Keep sample_5b.sh inference parameters, but let WorldArena prompt_target decide the requested content.
    # The one-line caption file is intentionally blank; no GPT/InternVL caption refinement is used.
    sample5b_caption_lines: 1
    num_euler_timesteps: 4
    rand_num_img: 0.6
    height: 704
    width: 1280
    sample_num: 1
    frame_zero: 32
    latent_frame_zero: 8
    shift: 5.0
    seed: 43
    resolution: 704x1280
    action_source: worldarena_camera_path
    worldarena_action_speed_cue: The motion speed is moderate.
    gpu_index: 0
    refine_from_image: false
    # Optional prompt-refinement model root. Needed only when refine_from_image or load_caption_model is enabled.
    caption_model_dir: /share/project/yesliu/hjd/model/tmp/YUME/InternVL3-2B-Instruct
    load_caption_model: false
    memory_optimization: false
    vae_memory_optimization: false
    camera_movement1_by_suite:
      video_static: None
      video_dynamic: None
    camera_movement2_by_suite:
      video_static: ·
      video_dynamic: ·

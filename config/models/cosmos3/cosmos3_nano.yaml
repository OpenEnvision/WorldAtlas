# Cosmos3-Nano via the official NVIDIA cosmos-framework repository.
model:
  name: cosmos3-nano
  family: cosmos3
  backend_type: local_repo
  task_families:
  - world_model
  - video_generation
  artifact_types:
  - video
  control_signals:
  - text
  - image
  roles:
  - candidate
  python_bin: python
  repo_root: thirdparty/cosmos-framework
  checkpoint_dir: ckpt/Cosmos3-Nano
  entrypoint: cosmos_framework/scripts/inference.py
  output_ext: .mp4
  supported_suites:
  - image_static
  - image_dynamic
  prompt_mode: prompt_target
  reference_mode: first_frame
  generation:
    require_persistent_batch: true
    nproc_per_node: 8
    parallelism_preset: throughput
    model_mode: image2video
    resolution: '720'
    aspect_ratio: 16,9
    num_frames: 189
    fps: 24
    num_steps: 35
    guidance: 6.0
    enable_sound: false
    guardrails: false
    seed: 0
    increment_seed: true
    continue_on_error: true
  env:
    HF_HUB_OFFLINE: '1'
    TRANSFORMERS_OFFLINE: '1'
  metadata:
    upstream_repo: https://github.com/NVIDIA/cosmos-framework.git
    upstream_model_id: nvidia/Cosmos3-Nano
    revision: 411f42a8fdfb8c5b2583cb8786e0938f49796eaa
    entrypoint_module: cosmos_framework.scripts.inference
    params: 16B

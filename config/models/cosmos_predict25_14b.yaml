# Cosmos-Predict2.5-14B via the standalone nvidia-cosmos/cosmos-predict2.5 repo.
# Loads native .pt checkpoints (base/pre-trained, base/post-trained). Requires
# the repo venv: `uv sync --extra=cu128 --python <python3.10>` under repo_root.
# Also requires HF access (HF_TOKEN) to fetch auxiliary weights on first run:
#   nvidia/Cosmos-Predict2.5-2B/tokenizer.pth, nvidia/Cosmos-Reason1-7B (text encoder).
model:
  name: cosmos-predict2.5-14b
  family: cosmos_predict25
  backend_type: local_repo
  task_families: [world_model, video_generation]
  artifact_types: [video]
  control_signals: [text, image]
  roles: [candidate]
  python_bin: thirdparty/cosmos-predict2.5/.venv/bin/python
  repo_root: thirdparty/cosmos-predict2.5
  checkpoint_dir: ckpt/Cosmos-Predict2.5-14B
  entrypoint: examples/inference.py
  output_ext: .mp4
  supported_suites:
    - image_static
    - image_dynamic
    - video_static
    - video_dynamic
  prompt_mode: prompt_target
  reference_mode: first_frame
  generation:
    require_persistent_batch: true
    inference_type: image2world
    model: 14B/post-trained
    model_size: 14B
    checkpoint_variant: post-trained
    checkpoint_path: ckpt/Cosmos-Predict2.5-14B/base/post-trained/e21d2a49-4747-44c8-ba44-9f6f9243715f_ema_bf16.pt
    local_aux:
      reason1_dir: ckpt/Cosmos-Reason1-7B
      tokenizer_vae: ckpt/Wan2.1-I2V-14B-480P/Wan2.1_VAE.pth
    num_gpus: 8
    context_parallel_size: 8
    num_output_frames: 93
    stage_rgb_inputs: false
    num_steps: 35
    guidance: 7
    seed: 0
    disable_guardrails: true
    offload_guardrail_models: true
    offload_text_encoder: true
    offload_tokenizer: true
  env:
    WORLDARENA_CHECKPOINT_ROOT: ckpt/
    HF_HOME: ckpt/.hf_home
    HUGGINGFACE_HUB_CACHE: ckpt/.hf_home/hub
    TORCH_HOME: ckpt/
    XDG_CACHE_HOME: ckpt/
    PATH: thirdparty/cosmos-predict2.5/.venv/bin:/usr/local/cuda/bin:/usr/local/bin:/usr/bin:/bin
    CUDA_PATH: /usr/local/cuda-12.9
    HF_HUB_OFFLINE: "0"
    TRANSFORMERS_OFFLINE: "0"

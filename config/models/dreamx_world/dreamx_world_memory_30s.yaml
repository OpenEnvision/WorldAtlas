model:
  name: dreamx-world-5b-cam-memory-30s
  family: dreamx_world
  backend_type: local_repo
  task_families:
  - world_model
  - video_generation
  artifact_types:
  - video
  control_signals:
  - text
  - image
  - camera_pose
  roles:
  - candidate
  python_bin: python
  repo_root: thirdparty/DreamX-World
  checkpoint_dir: ckpt/GD-ML--DreamX-World-5B-Cam
  entrypoint: inference_dreamx5b.py
  output_ext: .mp4
  supported_suites:
  - memory_loop
  prompt_mode: prompt_target
  reference_mode: first_frame
  generation:
    config_path: configs/dreamx-ar/causal_camera_forcing_5b.yaml
    model_name: ckpt/Wan-AI--Wan2.2-TI2V-5B
    transformer_path: configs/dreamx-ar
    nproc_per_node: 1
    ulysses_degree: 1
    ring_degree: 1
    master_addr: 127.0.0.1
    master_port: 29627
    cam_method: prope
    add_control_adapter: true
    sample_height: 704
    sample_width: 1280
    video_length: 121
    fps: 16
    guidance_scale: 3.0
    num_inference_steps: 50
    seed: 42
    weight_dtype: bfloat16
    action_speed: 4
    rotation_speed: 6
    max_action_segments: 0
    entrypoint: inference_ar_forcing.py
    num_output_frames: 123
    chunk_relative: true
    color_correction_strength: 1.0
    base_checkpoint_path: ckpt/GD-ML--DreamX-World-5B/model.safetensors
  metadata:
    variant: DreamX-World 5B camera-controlled, full-sequence short clip
    long_rollout_entrypoint: inference_ar_forcing.py
    notes: 'This config drives the full-sequence entrypoint, which tops out near five seconds. The 60-second
      memory variant switches to the chunk-wise causal AR-forcing entrypoint and needs base_checkpoint_path.

      '
    track: memory_loop
    memory_roster_key: dreamx_world
    derived_from: dreamx_world.yaml
    memory_notes: Chunk-wise causal AR on the DreamX-World-5B weights (not the 5B-Cam short clip). The
      runner builds the chunk-wise command and memory samples keep their full itinerary instead of the
      three-segment truncation.
    memory_duration_seconds: 30
    memory_reference_duration_seconds: 60
    memory_reference_config: dreamx_world_memory.yaml

model:
  name: matrix-game-1
  family: matrix_game_1
  backend_type: local_repo
  task_families: [world_model, video_generation]
  artifact_types: [video]
  control_signals: [image, actions]
  roles: [candidate]
  repo_root: thirdparty/Matrix-Game-1
  checkpoint_dir: ckpt/Matrix-Game-1.0
  entrypoint: inference_bench.py
  output_ext: .mp4
  supported_suites:
    - video_static
    - video_dynamic
  prompt_mode: none
  reference_mode: first_frame
  env:
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  generation:
    video_length: 65
    guidance_scale: 6.0
    inference_steps: 50
    shift: 15.0
    num_pre_frames: 5
    num_steps: 50
    rel_l1_thresh: 0.075
    resolution: [1280, 720]
    fps: 16
    seed: 42
    bfloat16: true
    attack_period_frames: 8
    action_plan:
      default:
        - forward
        - camera_r
        - forward_right
        - camera_l
        - forward
      by_suite:
        video_static:
          - forward
          - camera_r
          - forward
          - camera_l
        video_dynamic:
          - forward
          - jump
          - camera_r
          - forward_right
          - camera_l

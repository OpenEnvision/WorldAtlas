model:
  name: hunyuanworld-voyager-image-static-smoke
  family: hunyuanworld_voyager
  backend_type: local_repo
  task_families: [video_generation, scene_3d_generation]
  artifact_types: [video]
  control_signals: [text, image, camera_pose]
  roles: [candidate]
  python_bin: /mnt/cpfs/yangboxue/visual_generation/juanxi/conda/envs/hunyuanworld-voyager/bin/python
  repo_root: /mnt/cpfs/yangboxue/visual_generation/juanxi/github_repos/HunyuanWorld-Voyager
  checkpoint_dir: /mnt/cpfs/yangboxue/visual_generation/juanxi/ckpt/HunyuanWorld-Voyager
  entrypoint: sample_image2video.py
  output_ext: .mp4
  supported_suites:
    - image_static
  prompt_mode: prompt_target
  reference_mode: reference_image
  generation:
    model: HYVideo-T/2
    video_size: [512, 768]
    video_length: 129
    infer_steps: 1
    cfg_scale: 6.0
    embedded_cfg_scale: 6.0
    flow_shift: 7.0
    flow_reverse: true
    seed: 0
    i2v_resolution: 720p
    i2v_condition_type: latent_concat
    i2v_stability: true
    use_context_block: false
    use_cpu_offload: false
    num_gpus: 8
    ulysses_degree: 8
    ring_degree: 1
    fps: 24
    moge_image_size: [720, 1280]
    moge_checkpoint: /mnt/cpfs/yangboxue/visual_generation/juanxi/ckpt/Ruicheng--moge-vitl/model.pt
  env:
    WORLDARENA_CHECKPOINT_ROOT: /mnt/cpfs/yangboxue/visual_generation/juanxi/ckpt
    ALLOW_RESIZE_FOR_SP: "1"
    TOKENIZERS_PARALLELISM: "false"

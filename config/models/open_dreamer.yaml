model:
  name: open-dreamer
  family: open_dreamer
  backend_type: local_repo
  task_families: [world_model, video_generation]
  artifact_types: [video]
  # Open Dreamer is steered by per-frame Minecraft/VPT actions, never by text.
  control_signals: [video, actions]
  roles: [candidate]
  # Open Dreamer is a JAX/Flax stack pinned to Python 3.11 + jax[cuda12]; keep it
  # in the upstream uv virtualenv created by scripts/setup_open_dreamer.sh.
  python_bin: thirdparty/open-dreamer/.venv/bin/python
  repo_root: thirdparty/open-dreamer
  # Orbax checkpoint root holding numbered step directories (for example 250000/)
  # with `tokenizer/` and `dynamics_ema/` items.
  checkpoint_dir: ckpt/open-dreamer
  # Upstream ships no inference script; the WorldArena runner drives this module.
  entrypoint: dreamer/generation.py
  output_ext: .mp4
  supported_suites:
    - image_static
    - image_dynamic
    - video_static
    - video_dynamic
  prompt_mode: none
  # The rollout is conditioned on several real context frames, so request a
  # conditioning clip rather than a single anchor frame. Image assets are frozen
  # into a clip by the harness.
  reference_mode: reference_video
  env:
    # JAX preallocates 75% of device memory by default, which starves the
    # per-GPU workers used for batch production.
    XLA_PYTHON_CLIENT_PREALLOCATE: "false"
    XLA_PYTHON_CLIENT_MEM_FRACTION: "0.95"
  generation:
    require_persistent_batch: true
    gpus_per_worker: 1
    # Frames the harness puts in the conditioning clip; keep >= context_frames.
    conditioning_video_frames: 4
    # Ground-truth frames encoded before the rollout starts.
    context_frames: 4
    # Frames generated after the context window.
    horizon: 64
    # Shortcut sampling steps per frame (upstream uses 4; k_max for full diffusion).
    num_steps: 4
    # Released checkpoints ship `dynamics_ema` only.
    use_ema: true
    use_kv_cache: true
    decode_chunk_size: 16
    parallel_strategy: data
    seed: 0
    allow_cpu: false
    # VPT gameplay is recorded at 20 Hz.
    fps: 20
    # Trained frame geometry: 360x640 content zero-padded to 368x640. Both are
    # re-read from the restored tokenizer; these values only feed dry runs.
    model_height: 368
    model_width: 640
    content_height: 360
    # `crop` keeps the frame full-bleed like the training data; `pad` letterboxes.
    fit_mode: crop
    # Drop the 4px training pad from predictions so scoring sees content only.
    crop_model_padding: true
    # Per-frame mouse deltas in raw VPT pixels (0.15 degrees per pixel):
    # 20px yaw is about 3 deg/frame (60 deg/s at 20 fps) and 13px pitch about 2 deg/frame.
    mouse_pan_pixels: 20.0
    mouse_tilt_pixels: 13.0
  metadata:
    upstream_repo: https://github.com/next-state/open-dreamer.git
    upstream_revision: 5a4127fcbbd37b3cd9237904d645fb11348bab28
    checkpoint_repo: reactor-team/open-dreamer
    paper: https://danijar.com/project/dreamer4/
    domain: minecraft_vpt
    action_contract: worldarena_camera_path_to_minecraft_vpt_actions
    # Minecraft/VPT has no roll axis, so roll_cw / roll_ccw camera segments are
    # rejected instead of silently scored as an attempted roll.
    unsupported_camera_tokens: [roll_cw, roll_ccw]

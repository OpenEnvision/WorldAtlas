model:
  name: lyra-1-juanxi-stage1-left-promptcurrent-debug
  family: lyra1
  backend_type: local_repo
  task_families: [video_generation, scene_3d_generation]
  artifact_types: [video]
  control_signals: [text, image]
  roles: [candidate]
  python_bin: /mnt/cpfs/yangboxue/visual_generation/juanxi/conda/envs/lyra/bin/python
  repo_root: /mnt/cpfs/yangboxue/visual_generation/juanxi/github_repos/lyra/Lyra-1
  checkpoint_dir: /mnt/cpfs/yangboxue/visual_generation/juanxi/ckpt/Lyra
  entrypoint: sample.py
  output_ext: .mp4
  env:
    CUDA_HOME: /mnt/cpfs/yangboxue/visual_generation/juanxi/conda/envs/lyra
    WORLDARENA_CHECKPOINT_ROOT: /mnt/cpfs/yangboxue/visual_generation/juanxi/ckpt
  supported_suites:
    - image_static
  prompt_mode: prompt_current
  reference_mode: first_frame
  generation:
    num_gpus: 8
    stage1_num_gpus: 1
    num_video_frames: 121
    height: 704
    width: 1280
    fps: 24
    seed: 42
    guidance: 1.0
    num_steps: 35
    trajectory: left
    camera_rotation: center_facing
    movement_distance: 0.1
    total_movement_distance_factor: 1.0
    filter_points_threshold: 0.1
    foreground_masking: true
    multi_trajectory: false
    use_sample_camera_path: false
    target_index_subsample: 1
    output_view_index: 0
    skip_stage2: true

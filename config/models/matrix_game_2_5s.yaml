model:
  name: matrix-game-2-5s
  family: matrix_game_2
  backend_type: local_repo
  task_families: [world_model, video_generation]
  artifact_types: [video]
  control_signals: [image, actions]
  roles: [candidate]
  python_bin: /share/project/yesliu/miniconda3/envs/matrix-game-2.0/bin/python
  repo_root: thirdparty/Matrix-Game/Matrix-Game-2
  checkpoint_dir: ckpt/Skywork--Matrix-Game-2.0
  entrypoint: inference.py
  output_ext: .mp4
  supported_suites:
    - image_static
    - image_dynamic
    - video_static
    - video_dynamic
  prompt_mode: prompt_target
  reference_mode: first_frame
  env:
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  generation:
    mode: universal
    config_path: configs/inference_yaml/inference_universal.yaml
    checkpoint_filename: base_distilled_model/base_distill.safetensors
    num_output_frames: 18
    save_num_frames: 60
    output_fps: 12
    seed: 42
    compile_vae: true
    action_source: worldarena_prompt
    action_plan:
      default:
        - forward
        - camera_r
        - forward_right
        - camera_l
        - forward
      by_suite:
        image_static:
          - forward
          - camera_r
          - forward
          - camera_l
        image_dynamic:
          - forward
          - left
          - camera_r
          - forward_right
          - camera_l
        video_static:
          - forward
          - camera_r
          - forward
          - camera_l
        video_dynamic:
          - forward
          - left
          - camera_r
          - forward_right
          - camera_l
      frames_per_action: 12

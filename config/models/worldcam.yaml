model:
  name: worldcam
  family: worldcam
  backend_type: local_repo
  task_families: [world_model, video_generation]
  artifact_types: [video]
  control_signals: [text, video, camera_pose]
  roles: [candidate]
  repo_root: thirdparty/WorldCam
  checkpoint_dir: ckpt/worldcam
  entrypoint: inference.py
  output_ext: .mp4
  supported_suites:
    - video_static
  prompt_mode: prompt_current
  reference_mode: reference_video
  env:
    WORLDARENA_CHECKPOINT_ROOT: ckpt/
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  generation:
    height: 480
    width: 832
    cond_frames: 65
    camera_frames: auto
    output_fps: match_gt
    output_quality: 4
    cfg_scale: 4.0
    seed: 0
    num_ar_steps: auto
    match_gt_frame_count: true
    match_gt_fps: true
    attention_sink_inference: false
    long_term_memory_start: 30
    long_term_memory_num_clips: 4
    long_term_memory_ref_indices: [48, 52, 56, 60]
    device: cuda
    torch_dtype: bfloat16
    weights_filename: finetuned_dit.safetensors

model:
  name: ac3d-cogvideox-5b-i2v
  family: ac3d
  backend_type: local_repo
  task_families: [world_model, video_generation]
  artifact_types: [video]
  control_signals: [text, image, camera_pose]
  roles: [candidate]
  python_bin: /mnt/cpfs/yangboxue/visual_generation/juanxi/conda/envs/ac3d/bin/python
  repo_root: /mnt/cpfs/yangboxue/visual_generation/juanxi/github_repos/ac3d
  checkpoint_dir: /mnt/cpfs/yangboxue/visual_generation/juanxi/ckpt/ac3d
  entrypoint: inference/cli_demo_camera.py
  output_ext: .mp4
  supported_suites:
    - image_static
    - image_dynamic
  prompt_mode: prompt_target
  reference_mode: reference_image
  env:
    WORLDARENA_CHECKPOINT_ROOT: /mnt/cpfs/yangboxue/visual_generation/juanxi/ckpt
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    TOKENIZERS_PARALLELISM: "false"
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  metadata:
    upstream_repo: snap-research/ac3d
    upstream_entrypoint: inference/cli_demo_camera.py
    image_conditioning_contract: first_frame_prompt_target_camera_path
    note: WorldArena runner uses the AC3D I2V pipeline, the sample reference image, and synthetic Plucker camera controls from camera_path.
  generation:
    variant: 5b
    conditioning_mode: image
    video_root_dir:
    annotation_json: annotations/test.json
    base_model_path: /mnt/cpfs/yangboxue/visual_generation/juanxi/ckpt/CogVideoX-5b-I2V
    controlnet_model_path: 5B/checkpoint-10000.pt
    camera_index: 0
    controlnet_weights: 1.0
    controlnet_guidance_start: 0.0
    controlnet_guidance_end: 0.4
    use_dynamic_cfg: true
    num_inference_steps: 10
    guidance_scale: 6.0
    num_videos_per_prompt: 1
    dtype: bfloat16
    seed: 42
    num_frames: 49
    fps: 8
    min_duration_seconds: 5.0
    height: 480
    width: 720
    stride_min: 2
    stride_max: 2
    focal_scale: 0.9
    downscale_coef: 8
    controlnet_input_channels: 6
    controlnet_transformer_num_attn_heads: 4
    controlnet_transformer_attention_head_dim: 64
    controlnet_transformer_out_proj_dim_factor: 64
    controlnet_transformer_out_proj_dim_zero_init: true
    offload_mode: none

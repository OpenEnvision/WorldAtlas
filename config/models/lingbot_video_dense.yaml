model:
  name: lingbot-video-dense-1.3b
  family: lingbot_video
  backend_type: local_repo
  task_families: [video_generation]
  artifact_types: [video]
  # LingBot-Video is TI2V: camera motion is conveyed through text, not an explicit pose tensor.
  control_signals: [text, image]
  roles: [candidate]
  python_bin: thirdparty/lingbot-video/.venv/bin/python
  repo_root: thirdparty/lingbot-video
  checkpoint_dir: ckpt/lingbot-video-dense-1.3b
  entrypoint: scripts/inference.py
  output_ext: .mp4
  supported_suites:
    - image_static
    - image_dynamic
    - video_static
    - video_dynamic
  prompt_mode: prompt_target
  reference_mode: first_frame
  generation:
    require_persistent_batch: true
    backend: diffusers
    mode: ti2v
    prompt_strategy: structured
    duration: 5.0
    height: 480
    width: 832
    fps: 24
    steps: 40
    guidance_scale: 3.0
    shift: 3.0
    seed: 42
    increment_seed: true
    transformer_dtype: bf16
    text_encoder_dtype: bf16
    vae_dtype: fp32
    qwen_attn_implementation: sdpa
    batch_cfg: true
    reuse_condition_features: true
    allow_tf32: true
    nproc_per_node: 1
    context_parallel_degree: 1
    enable_fsdp_inference: false
    continue_on_error: true
    run_refiner: false
  env:
    WORLDARENA_CHECKPOINT_ROOT: ckpt
    DIFFUSERS_ATTN_BACKEND: _native_flash
    LINGBOT_QWEN_ATTN_IMPLEMENTATION: sdpa
  metadata:
    variant: dense-1.3b
    upstream_model_id: robbyant/lingbot-video-dense-1.3b
    conditioning: ti2v
    camera_control: text_only

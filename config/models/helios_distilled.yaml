model:
  name: helios-distilled-i2v
  family: helios
  backend_type: local_repo
  task_families: [video_generation]
  artifact_types: [video]
  control_signals: [text, image]
  roles: [candidate]
  python_bin: /mnt/cpfs/yangboxue/visual_generation/juanxi/conda/envs/helios/bin/python
  repo_root: /mnt/cpfs/yangboxue/visual_generation/juanxi/github_repos/Helios
  checkpoint_dir: /mnt/cpfs/yangboxue/visual_generation/juanxi/ckpt/Helios-Distilled
  entrypoint: infer_helios.py
  output_ext: .mp4
  supported_suites:
    - image_static
    - image_dynamic
    - video_static
    - video_dynamic
  prompt_mode: prompt_target
  reference_mode: first_frame
  generation:
    sample_type: i2v
    height: 384
    width: 640
    num_frames: 99
    fps: 24
    num_inference_steps: 50
    guidance_scale: 1.0
    seed: 42
    weight_dtype: bf16
    image_noise_sigma_min: 0.111
    image_noise_sigma_max: 0.135
    is_enable_stage2: true
    pyramid_num_inference_steps_list: [2, 2, 2]
    is_amplify_first_chunk: true
    enable_compile: false
    enable_low_vram_mode: false
    disable_flash_attention: false
    num_gpus: 1
    cp_backend: ulysses
  env:
    WORLDARENA_CHECKPOINT_ROOT: /mnt/cpfs/yangboxue/visual_generation/juanxi/ckpt

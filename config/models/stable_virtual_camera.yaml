model:
  name: stable-virtual-camera
  family: stable_virtual_camera
  backend_type: local_repo
  task_families: [video_generation, scene_3d_generation]
  artifact_types: [video]
  control_signals: [image, camera_pose]
  roles: [candidate]
  python_bin: /mnt/cpfs/yangboxue/visual_generation/juanxi/conda/envs/stabel-visual-camera/bin/python
  repo_root: /mnt/cpfs/yangboxue/visual_generation/juanxi/github_repos/stable-virtual-camera
  checkpoint_dir: /mnt/cpfs/yangboxue/visual_generation/juanxi/ckpt/stable-virtual-camera
  entrypoint: demo.py
  output_ext: .mp4
  supported_suites:
    - image_static
    - image_dynamic
  prompt_mode: none
  reference_mode: reference_image
  generation:
    checkpoint_root: /mnt/cpfs/yangboxue/visual_generation/juanxi/ckpt
    model_version: 1.1
    weight_name: modelv1.1.safetensors
    task: img2trajvid_s-prob
    use_traj_prior: true
    H: 576
    W: 576
    T: 21
    # >= 5s output: ~ (num_targets) frames at video_save_fps. 72 / 12 = 6.0s.
    num_targets: 72
    num_steps: 50
    cfg: [4.0, 2.0]
    guider_types: [1, 2]
    cfg_min: 1.2
    camera_scale: 2.0
    chunk_strategy: interp
    chunk_strategy_first_pass: gt-nearest
    replace_or_include_input: true
    video_save_fps: 12
    seed: 23
    offline: true

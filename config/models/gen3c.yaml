model:
  name: gen3c
  family: gen3c
  backend_type: local_repo
  task_families: [video_generation, scene_3d_generation]
  artifact_types: [video]
  control_signals: [text, image, camera_pose]
  roles: [candidate]
  # GEN3C's published environment targets Python 3.10 plus custom CUDA extensions.
  # WorldArena expects the GEN3C inference code from the prepared checkout below.
  repo_root: /bench-workspace/yesliu/hjd/model/tmp/GEN3C
  # Store the main model under ckpt/nvidia--GEN3C-Cosmos-7B and keep companion tokenizer/T5/MoGe weights under ckpt/.
  checkpoint_dir: ckpt/nvidia--GEN3C-Cosmos-7B
  python_bin: /share/project/yesliu/miniconda3/envs/cosmos-predict1/bin/python
  entrypoint: cosmos_predict1/diffusion/inference/gen3c_single_image.py
  output_ext: .mp4
  supported_suites:
    - image_static
    - video_static
    - video_dynamic
  prompt_mode: prompt_target
  reference_mode: first_frame
  generation:
    num_gpus: 1
    num_video_frames: 121
    height: 704
    width: 1280
    fps: 24
    seed: 42
    guidance: 1.0
    num_steps: 35
    trajectory: left
    camera_rotation: center_facing
    movement_distance: 0.3
    filter_points_threshold: 0.05
    use_sample_camera_path: true
    foreground_masking: true
    offload_diffusion_transformer: false
    offload_tokenizer: false
    offload_text_encoder_model: false

model:
  name: cameractrl
  family: cameractrl
  backend_type: local_repo
  task_families: [world_model, video_generation]
  artifact_types: [video]
  control_signals: [text, camera_pose]
  roles: [candidate]
  python_bin: /share/project/yesliu/miniconda3/envs/cameractrl-cu128/bin/python
  repo_root: thirdparty/CameraCtrl
  checkpoint_dir: ckpt/CameraCtrl
  entrypoint: inference.py
  output_ext: .mp4
  supported_suites:
    - image_static
    - image_dynamic
    - video_static
    - video_dynamic
  prompt_mode: prompt_target
  reference_mode: none
  generation:
    ori_model_path: /WorldArena_ckpt/stable-diffusion-v1-5
    # Official CameraCtrl/AnimateDiffV3 path after merging v3_sd15_adapter.ckpt
    # with tools/merge_lora2unet.py.
    unet_subfolder: unet_webvidlora_v3
    motion_module_ckpt: /WorldArena_ckpt/animatediff/v3_sd15_mm.ckpt
    pose_adaptor_ckpt: CameraCtrl.ckpt
    image_lora_ckpt:
    image_lora_rank: 2
    personalized_base_model:
    model_config: configs/train_cameractrl/adv3_256_384_cameractrl_relora.yaml
    image_height: 256
    image_width: 384
    video_length: 16
    original_pose_width: 1280
    original_pose_height: 720
    target_duration_sec:
    num_inference_steps: 25
    guidance_scale: 14.0
    seed: 42
    synthetic_focal_scale: 0.65
    translation_step: 1.0
    lateral_step: 0.5
    rotation_degrees: 30.0

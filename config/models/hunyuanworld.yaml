model:
  name: hunyuanworld
  family: hunyuanworld
  backend_type: local_repo
  task_families: [scene_3d_generation]
  artifact_types: [mesh]
  control_signals: [text, image]
  roles: [candidate]
  # HunyuanWorld's published environment targets Python 3.10 with a dedicated CUDA stack.
  # Place the upstream repo under thirdparty/ after preparing the conda environment externally.
  repo_root: thirdparty/HunyuanWorld-1.0
  # Keep all HunyuanWorld weights under the unified ckpt root.
  checkpoint_dir: ckpt/HunyuanWorld-1
  # The adapter orchestrates both demo_panogen.py and demo_scenegen.py through a dedicated runner.
  entrypoint: demo_panogen.py
  output_ext: .zip
  supported_suites:
    - image_static
    - video_static
  prompt_mode: prompt_current
  reference_mode: first_frame
  generation:
    classes: null
    labels_fg1_limit: 1
    labels_fg2_limit: 1
    derived_label_limit: 2
    negative_prompt: ""
    seed: 42
    gpu_index: 0
    fp8_attention: false
    fp8_gemm: false
    cache: false
    export_drc: false

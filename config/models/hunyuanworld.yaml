model:
  name: hunyuanworld
  family: hunyuanworld
  backend_type: local_repo
  task_families: [scene_3d_generation]
  artifact_types: [mesh]
  control_signals: [text, image]
  roles: [candidate]
  # HunyuanWorld's published environment targets Python 3.10 with a dedicated CUDA stack.
  python_bin: .runtime310/bin/python
  # Open-source default: clone the upstream repo under third_party/ or link it with `worldarena prepare-layout --repo-link`.
  repo_root: third_party/HunyuanWorld-1.0
  # The upstream code downloads multiple base models through Hugging Face; keep them under the shared cache root.
  checkpoint_dir: cache/hfd/tencent--HunyuanWorld-1
  # The adapter orchestrates both demo_panogen.py and demo_scenegen.py through a dedicated runner.
  entrypoint: demo_panogen.py
  output_ext: .zip
  supported_suites:
    - image_static
    - video_static
  prompt_mode: prompt_current
  reference_mode: first_frame
  env:
    HF_HOME: cache/hfd
    HF_HUB_CACHE: cache/hfd/huggingface/hub
    TRANSFORMERS_CACHE: cache/hfd/transformers
  generation:
    classes: null
    labels_fg1_limit: 1
    labels_fg2_limit: 1
    derived_label_limit: 2
    negative_prompt: ""
    seed: 42
    gpu_index: 0
    fp8_attention: false
    fp8_gemm: false
    cache: false
    export_drc: false

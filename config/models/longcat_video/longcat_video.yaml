
model:
  name: longcat-video-i2v
  family: longcat_video
  backend_type: local_repo
  task_families: [video_generation]
  artifact_types: [video]
  control_signals: [text, image]
  roles: [candidate]
  python_bin: python
  repo_root: thirdparty/LongCat-Video
  checkpoint_dir: ckpt/meituan-longcat--LongCat-Video
  entrypoint: run_demo_image_to_video.py
  output_ext: .mp4
  supported_suites: [image_static, image_dynamic]
  prompt_mode: prompt_target
  reference_mode: first_frame
  generation:
    resolution: 480p
    num_frames: 93
    num_inference_steps: 50
    guidance_scale: 4.0
    fps: 15
    seed: 42
    context_parallel_size: 1
    enable_compile: false

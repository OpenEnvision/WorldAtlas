model:
  name: cami2v
  family: cami2v
  backend_type: local_repo
  task_families: [world_model, video_generation]
  artifact_types: [video]
  control_signals: [text, image, camera_pose]
  roles: [candidate]
  # Official environment: Python 3.10, PyTorch 2.4.1, CUDA 12.1.
  repo_root: thirdparty/CamI2V
  checkpoint_dir: ckpt/CamI2V
  entrypoint: demo/cami2v_test.py
  output_ext: .mp4
  supported_suites:
    - image_static
    - image_dynamic
  prompt_mode: prompt_target
  reference_mode: first_frame
  generation:
    require_persistent_batch: true
    config_file: configs/inference/003_cami2v_512x320.yaml
    # The official models.json currently says .safetensors, but the released
    # 100k Hugging Face artifact is this .pt file.
    checkpoint_file: 512_cami2v_100k.pt
    checkpoint_size_bytes: 5742275265
    width: 512
    height: 320
    video_length: 16
    fps: 10
    num_inference_steps: 25
    cfg_scale: 7.5
    camera_cfg: 1.0
    trace_extract_ratio: 1.0
    trace_scale_factor: 1.0
    frame_stride: 1
    eta: 1.0
    seed: 123
    enable_camera_condition: true
    # Do not append the Gradio demo's fixed "detailed fur" prompt suffix to
    # benchmark prompts.
    append_official_prompt_suffix: false
    negative_prompt: >-
      Fast movement, jittery motion, abrupt transitions, distorted body,
      missing limbs, unnatural posture, blurry, cropped, extra limbs, bad
      anatomy, deformed, glitchy motion, artifacts.
  env:
    WORLDARENA_CHECKPOINT_ROOT: ckpt
    TOKENIZERS_PARALLELISM: "false"
  metadata:
    upstream_repo: https://github.com/ZGCTroy/CamI2V.git
    upstream_revision: c5d7b2fcdeb89a1ce9a0ef376909d9539b95639f
    checkpoint_repo: MuteApo/CamI2V
    camera_contract: worldarena_c2w_to_official_realestate10k_w2c

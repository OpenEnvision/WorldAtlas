model:
  name: lingbot-world-base-act-preview
  family: lingbot_world
  backend_type: local_repo
  task_families: [world_model, video_generation]
  artifact_types: [video]
  control_signals: [text, image, actions]
  roles: [candidate]
  repo_root: thirdparty/lingbot-world
  python_bin: /share/project/yesliu/miniconda3/envs/lingbot-world/bin/python
  checkpoint_dir: ckpt/lingbot-world-base-act-preview
  entrypoint: generate.py
  output_ext: .mp4
  supported_suites:
    - video_static
    - video_dynamic
  prompt_mode: prompt_target
  reference_mode: first_frame
  generation:
    task: i2v-A14B
    size: 832*480
    frame_num: 81
    base_seed: 42
    sample_solver: unipc
    sample_steps: 20
    offload_model: false
    allow_act2cam: true
    shared_checkpoint_dir: ckpt/lingbot-world-base-cam
  metadata:
    variant: base_act_preview
    upstream_model_id: robbyant/lingbot-world-base-act-preview

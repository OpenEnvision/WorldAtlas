model:
  name: matrix-game
  family: matrix_game_3
  backend_type: local_repo
  task_families: [world_model, video_generation]
  artifact_types: [video]
  control_signals: [text, image, actions]
  roles: [candidate]
  python_bin: auto
  # Open-source default: clone the upstream repo under third_party/ or link it with `worldarena prepare-layout --repo-link`.
  repo_root: third_party/Matrix-Game-3.0
  # Keep checkpoints under cache/hfd or point this at a shared cache mount through `worldarena prepare-layout --shared-hf-cache`.
  checkpoint_dir: cache/hfd/Matrix-Game-3.0
  entrypoint: generate.py
  output_ext: .mp4
  supported_suites:
    - video_static
    - video_dynamic
  prompt_mode: prompt_target
  reference_mode: first_frame
  generation:
    size: 704*1280
    fps: 17
    seed: 42
    num_inference_steps: 3
    sample_guide_scale: 5.0
    vae_type: mg_lightvae_v2
    compile_vae: true
    use_int8: true
    visualize_ops: false
    action_plan:
      default:
        - forward
        - camera_r
        - forward_right
        - camera_l
        - forward
      by_suite:
        video_static:
          - forward
          - camera_r
          - forward
          - camera_l
        video_dynamic:
          - forward
          - camera_r
          - forward_right
          - camera_l
          - forward
      frames_per_action: 12
      first_clip_frames: 57
      clip_overlap_frames: 16
      num_iterations: 2

model:
  name: helios-distilled-14b
  family: helios
  backend_type: local_repo
  task_families: [video_generation]
  artifact_types: [video]
  control_signals: [text, image]
  roles: [candidate]
  repo_root: thirdparty/Helios
  python_bin: python
  checkpoint_dir: ckpt/Helios/Helios-Distilled
  entrypoint: infer_helios.py
  output_ext: .mp4
  supported_suites: [image_static, image_dynamic]
  prompt_mode: prompt_target
  reference_mode: first_frame
  generation:
    variant: distilled
    require_persistent_batch: true
    nproc_per_node: 1
    width: 640
    height: 384
    fps: 24
    num_frames: 120
    seed: 42
    guidance_scale: 1.0
    # Portable SDPA route: no runtime download of Flash Attention Hub kernels.
    attention_backend: native
    use_official_kernels: false
    enable_low_vram_mode: false
  env:
    PYTHONNOUSERSITE: "1"
    TOKENIZERS_PARALLELISM: "false"
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
  metadata:
    official_repo: https://github.com/PKU-YuanGroup/Helios
    upstream_revision: babed9811266e4b5b111c9c1e0977a07899066ab
    checkpoint_repo: BestWishYsh/Helios-Distilled
    notes: Official persistent I2V; six-step pyramid sampling with amplified first chunk. No native camera/action control.

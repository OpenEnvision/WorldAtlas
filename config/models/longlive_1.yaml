model:
  name: longlive-1.0
  family: longlive_1
  backend_type: local_repo
  task_families: [video_generation]
  artifact_types: [video]
  control_signals: [text]
  roles: [candidate]
  python_bin: /mnt/cpfs/yangboxue/visual_generation/juanxi/conda/envs/realtime-video/bin/python
  repo_root: /mnt/cpfs/yangboxue/visual_generation/juanxi/github_repos/LongLive
  entrypoint: inference.py
  output_ext: .mp4
  supported_suites:
    - image_static
    - image_dynamic
    - video_static
    - video_dynamic
  prompt_mode: prompt_target
  reference_mode: none
  generation:
    version: "1.0"
    git_ref: origin/v1.0
    repo_cache_dir: /mnt/cpfs/yangboxue/visual_generation/juanxi/WorldArena/cache/longlive_sources
    config_path: configs/longlive_inference.yaml
    prompt_file_format: txt
    nproc_per_node: 1
    master_port: 29500
    use_torchrun: false
    config_overrides: {}
  env:
    WORLDARENA_CHECKPOINT_ROOT: /mnt/cpfs/yangboxue/visual_generation/juanxi/ckpt

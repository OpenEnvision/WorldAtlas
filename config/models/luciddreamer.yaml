model:
  name: luciddreamer
  family: luciddreamer
  backend_type: local_repo
  task_families: [video_generation, scene_3d_generation]
  artifact_types: [video, gaussian_splat]
  control_signals: [text, image]
  roles: [candidate]
  # LucidDreamer targets Python 3.9 plus compiled Gaussian rasterization extensions.
  # Keep the upstream repo under thirdparty/ or symlink it there after preparing its environment externally.
  repo_root: thirdparty/LucidDreamer
  entrypoint: run.py
  output_ext: .mp4
  supported_suites:
    - image_static
    - video_static
  prompt_mode: prompt_current
  reference_mode: first_frame
  generation:
    campath_gen: lookdown
    campath_render: llff
    seed: 1
    diff_steps: 50
    negative_prompt: ""
    model_name: ckpt/stabilityai--stable-diffusion-2-inpainting
    prompt_prefix: ""
    prompt_suffix: ""
    keep_work_dir: false

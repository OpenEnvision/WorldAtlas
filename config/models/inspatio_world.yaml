model:
  name: inspatio-world
  family: inspatio_world
  backend_type: local_repo
  task_families: [world_model, video_generation]
  artifact_types: [video]
  control_signals: [text, video, trajectory]
  roles: [candidate]
  # InSpatio-World currently expects a CUDA-capable Python 3.10 runtime with flash-attn.
  # Place the upstream repo under thirdparty/ after preparing the conda environment externally.
  repo_root: thirdparty/inspatio-world
  # Keep the upstream checkpoints under the unified ckpt root and preserve the original subdirectory names:
  # InSpatio-World-1.3B/, DA3/, Wan2.1-T2V-1.3B/, and optional taehv/.
  checkpoint_dir: ckpt/inspatio--world
  entrypoint: run_test_pipeline.sh
  output_ext: .mp4
  supported_suites:
    - video_static
    - video_dynamic
  prompt_mode: prompt_current
  reference_mode: reference_video
  generation:
    traj_txt_path: traj/x_y_circle_cycle.txt
    config_path: configs/inference_1.3b.yaml
    checkpoint_path: InSpatio-World-1.3B/InSpatio-World-1.3B.safetensors
    # The upstream DA3 package is a separate repo with a src/ layout.
    da3_repo_root: ../Depth-Anything-3
    da3_model_path: DA3
    step2_gpus: "0"
    step3_gpus: "0"
    step3_nproc: 1
    master_port: 29513
    relative_to_source: false
    rotation_only: false
    adaptive_frame: true
    freeze_repeat: 0
    use_tae: false
    tae_checkpoint_path: taehv/taew2_1.pth
    compile_dit: false
    radius_ratio: 1.0
    keep_work_dir: false

model:
  name: lingbot-video-moe-30b-a3b-base
  family: lingbot_video
  backend_type: local_repo
  task_families: [video_generation]
  artifact_types: [video]
  # This config evaluates the MoE base TI2V stage without the optional refiner.
  control_signals: [text, image]
  roles: [candidate]
  python_bin: thirdparty/lingbot-video/.venv/bin/python
  repo_root: thirdparty/lingbot-video
  checkpoint_dir: ckpt/lingbot-video-moe-30b-a3b
  entrypoint: scripts/inference.py
  output_ext: .mp4
  supported_suites:
    - image_static
    - image_dynamic
    - video_static
    - video_dynamic
  prompt_mode: prompt_target
  reference_mode: first_frame
  generation:
    require_persistent_batch: true
    backend: diffusers
    mode: ti2v
    prompt_strategy: structured
    duration: 5.0
    height: 480
    width: 832
    fps: 24
    steps: 40
    guidance_scale: 3.0
    shift: 3.0
    seed: 42
    increment_seed: true
    transformer_dtype: bf16
    text_encoder_dtype: bf16
    vae_dtype: fp32
    qwen_attn_implementation: sdpa
    batch_cfg: true
    reuse_condition_features: true
    allow_tf32: true
    nproc_per_node: 8
    master_port: 29547
    context_parallel_degree: 8
    context_parallel_ulysses_anything: true
    enable_fsdp_inference: true
    continue_on_error: true
    run_refiner: false
  env:
    WORLDARENA_CHECKPOINT_ROOT: ckpt
    DIFFUSERS_ATTN_BACKEND: _native_flash
    LINGBOT_QWEN_ATTN_IMPLEMENTATION: sdpa
    LINGBOT_MOE_PAD_BACKEND: vectorized
    LINGBOT_MOE_EXPERT_BACKEND: grouped_mm
  metadata:
    variant: moe-30b-a3b-base
    upstream_model_id: robbyant/lingbot-video-moe-30b-a3b
    conditioning: ti2v
    camera_control: text_only
    refiner: disabled

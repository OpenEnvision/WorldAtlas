# MiniMax H3 joint audio-video model via the official SGLang diffusion runtime
# (https://github.com/MiniMax-AI/MiniMax-H3, https://github.com/sgl-project/sglang).
model:
  name: minimax-h3
  family: minimax_h3
  backend_type: local_repo
  task_families: [video_generation]
  # Joint audio+video generation; audio rides as a 32 kHz stereo track in the mp4.
  artifact_types: [video]
  control_signals: [text, image]
  roles: [candidate]
  python_bin: python
  repo_root: thirdparty/sglang
  checkpoint_dir: ckpt/minimax-h3
  entrypoint: python/sglang/multimodal_gen/runtime/entrypoints/cli/generate.py
  output_ext: .mp4
  supported_suites:
    - image_static
    - image_dynamic
  prompt_mode: prompt_target
  reference_mode: first_frame
  generation:
    require_persistent_batch: true
    # WorldAtlas suite -> MiniMax H3 task is resolved in the runner:
    #   image_static / image_dynamic -> fl2va (first-frame-to-video)
    #   video_static / video_dynamic -> ref2va (reference-to-video)
    # Set `task` here to force one native task for every sample (t2va/fl2va/ref2va).
    # task: t2va
    num_gpus: 4
    ulysses_degree: 4
    performance_mode: speed
    short_edge: 768
    aspect_ratio: "16:9"
    duration_seconds: 5.0
    num_inference_steps: 50
    seed: 0
    increment_seed: true
    continue_on_error: true
  metadata:
    upstream_model_id: MiniMaxAI/MiniMax-H3
    upstream_repo: https://github.com/MiniMax-AI/MiniMax-H3
    inference_framework: sglang
    inference_repo: https://github.com/sgl-project/sglang.git
    pipeline_target: sglang.multimodal_gen:DiffGenerator
    tasks: [t2va, fl2va, ref2va]
    joint_audio_video: true
    audio_sample_rate: 32000

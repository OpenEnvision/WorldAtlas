model:
  name: longcat-video-i2v
  family: longcat_video
  backend_type: local_repo
  task_families: [video_generation]
  artifact_types: [video]
  control_signals: [text, image]
  roles: [candidate]
  python_bin: /mnt/cpfs/yangboxue/visual_generation/juanxi/conda/envs/longcat-video/bin/python
  repo_root: /mnt/cpfs/yangboxue/visual_generation/juanxi/github_repos/LongCat-Video
  checkpoint_dir: /mnt/cpfs/yangboxue/visual_generation/juanxi/ckpt/LongCat-Video
  entrypoint: run_demo_image_to_video.py
  output_ext: .mp4
  supported_suites:
    - image_static
    - image_dynamic
    - video_static
    - video_dynamic
  prompt_mode: prompt_target
  reference_mode: first_frame
  generation:
    resolution: 480p
    num_frames: 93
    num_inference_steps: 50
    guidance_scale: 4.0
    fps: 15
    seed: 42
    context_parallel_size: 1
    enable_compile: false
  env:
    WORLDARENA_CHECKPOINT_ROOT: /mnt/cpfs/yangboxue/visual_generation/juanxi/ckpt

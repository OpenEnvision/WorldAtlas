model:
  name: lyra-1
  family: lyra1
  backend_type: local_repo
  task_families: [video_generation, scene_3d_generation]
  artifact_types: [video]
  control_signals: [text, image]
  roles: [candidate]
  # Lyra-1 and its GEN3C stack target Python 3.10 with a dedicated CUDA environment.
  repo_root: thirdparty/Lyra-1
  # Store the Lyra-1 weights under ckpt/Lyra and keep companion GEN3C/T5/tokenizer/MoGe checkpoints under ckpt/.
  checkpoint_dir: ckpt/Lyra
  entrypoint: sample.py
  output_ext: .mp4
  supported_suites:
    - image_static
    - image_dynamic
    - video_static
    - video_dynamic
  prompt_mode: prompt_target
  reference_mode: first_frame
  generation:
    num_gpus: 1
    num_video_frames: 121
    height: 704
    width: 1280
    fps: 24
    seed: 42
    guidance: 1.0
    num_steps: 35
    trajectory: left
    camera_rotation: center_facing
    movement_distance: 0.3
    total_movement_distance_factor: 1.0
    foreground_masking: true
    multi_trajectory: true
    target_index_subsample: 4
    output_view_index: 0
    static_view_indices_fixed: ["5", "0", "1", "2", "3", "4"]

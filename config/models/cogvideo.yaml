model:
  name: cogvideo-x1.5-5b-i2v
  family: cogvideo
  backend_type: local_repo
  task_families: [video_generation]
  artifact_types: [video]
  control_signals: [text, image]
  roles: [candidate]
  python_bin: /mnt/cpfs/yangboxue/visual_generation/juanxi/conda/envs/CogVideo/bin/python
  repo_root: /mnt/cpfs/yangboxue/visual_generation/juanxi/github_repos/CogVideo
  checkpoint_dir: /mnt/cpfs/yangboxue/visual_generation/juanxi/ckpt/CogVideoX1.5-5B-I2V
  entrypoint: inference/cli_demo.py
  output_ext: .mp4
  supported_suites:
    - image_static
    - image_dynamic
    - video_static
    - video_dynamic
  prompt_mode: prompt_target
  reference_mode: first_frame
  generation:
    generate_type: i2v
    num_frames: 81
    num_inference_steps: 50
    guidance_scale: 6.0
    fps: 16
    dtype: bfloat16
    seed: 42
    cpu_offload: false
  env:
    WORLDARENA_CHECKPOINT_ROOT: /mnt/cpfs/yangboxue/visual_generation/juanxi/ckpt

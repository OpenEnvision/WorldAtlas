model:
  name: matrix-game-2
  family: matrix_game_2
  backend_type: local_repo
  task_families: [world_model, video_generation]
  artifact_types: [video]
  control_signals: [image, actions]
  roles: [candidate]
  python_bin: auto
  repo_root: third_party/Matrix-Game-2
  checkpoint_dir: cache/hfd/Skywork--Matrix-Game-2.0
  entrypoint: inference.py
  output_ext: .mp4
  supported_suites:
    - video_static
    - video_dynamic
  prompt_mode: none
  reference_mode: first_frame
  generation:
    mode: universal
    num_output_frames: 15
    output_fps: 12
    seed: 42
    compile_vae: false
    action_plan:
      default:
        - forward
        - camera_r
        - forward_right
        - camera_l
        - forward
      by_suite:
        video_static:
          - forward
          - camera_r
          - forward
          - camera_l
        video_dynamic:
          - forward
          - left
          - camera_r
          - forward_right
          - camera_l
      frames_per_action: 12

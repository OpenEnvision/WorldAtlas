model:
  name: dreamx-world-5b-cam
  family: dreamx_world
  backend_type: local_repo
  task_families: [world_model, video_generation]
  artifact_types: [video]
  control_signals: [text, image, camera_pose]
  roles: [candidate]
  python_bin: /mnt/cpfs/yangboxue/visual_generation/juanxi/conda/envs/sana/bin/python
  repo_root: /mnt/cpfs/yangboxue/visual_generation/juanxi/github_repos/DreamX-World
  checkpoint_dir: /mnt/cpfs/yangboxue/visual_generation/juanxi/ckpt/DreamX-World-5B-Cam
  entrypoint: inference_dreamx5b.py
  output_ext: .mp4
  supported_suites:
    - image_static
    - image_dynamic
    - video_static
    - video_dynamic
  prompt_mode: prompt_target
  reference_mode: first_frame
  env:
    WORLDARENA_CHECKPOINT_ROOT: /mnt/cpfs/yangboxue/visual_generation/juanxi/ckpt
    HF_HOME: /mnt/cpfs/yangboxue/visual_generation/juanxi/conda/hf-home
    HUGGINGFACE_HUB_CACHE: /mnt/cpfs/yangboxue/visual_generation/juanxi/conda/hf-home/hub
    TORCH_HOME: /mnt/cpfs/yangboxue/visual_generation/juanxi/conda/torch-home
    XDG_CACHE_HOME: /mnt/cpfs/yangboxue/visual_generation/juanxi/conda/xdg-cache
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    TOKENIZERS_PARALLELISM: "false"
    HF_HUB_OFFLINE: "0"
    TRANSFORMERS_OFFLINE: "0"
    PYTHONPATH: "/mnt/cpfs/yangboxue/visual_generation/juanxi/WorldArena:/mnt/cpfs/yangboxue/visual_generation/juanxi/github_repos/DreamX-World:/mnt/cpfs/yangboxue/visual_generation/juanxi/WorldArena/artifacts/runtime/dreamx_vendor"
    LD_LIBRARY_PATH: "/mnt/cpfs/yangboxue/visual_generation/juanxi/conda/envs/sana/lib:/usr/local/cuda-12.9/targets/x86_64-linux/lib:/usr/local/cuda-12.9/lib64:/usr/local/cuda/lib64"
  generation:
    config_path: configs/wan2.2/wan_ti2v_5b.yaml
    model_name: /mnt/cpfs/yangboxue/visual_generation/juanxi/ckpt/Wan2.2-TI2V-5B
    transformer_path: /mnt/cpfs/yangboxue/visual_generation/juanxi/ckpt/DreamX-World-5B-Cam
    nproc_per_node: 8
    ulysses_degree: 8
    ring_degree: 1
    master_addr: 127.0.0.1
    master_port: 29627
    cam_method: prope
    add_control_adapter: true
    sample_height: 704
    sample_width: 1280
    video_length: 121
    fps: 24
    guidance_scale: 3.0
    num_inference_steps: 50
    seed: 42
    weight_dtype: bfloat16
    action_speed: 4
    rotation_speed: 6
    max_action_segments: 3

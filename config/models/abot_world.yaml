model:
  name: abot-world-0-5b-lf
  family: abot_world
  backend_type: local_repo
  task_families: [world_model, video_generation]
  artifact_types: [video]
  control_signals: [text, image, actions]
  roles: [candidate]
  # Keep ABot-World in an isolated Python 3.12 environment; its CUDA/PyTorch
  # stack differs from WorldArena's evaluation environment.
  repo_root: thirdparty/ABot-World
  python_bin: thirdparty/ABot-World/.venv/bin/python
  checkpoint_dir: ckpt/ABot-World-0-5B-LF
  entrypoint: web_client/pipeline_loader.py
  output_ext: .mp4
  supported_suites:
    - image_static
    - image_dynamic
  prompt_mode: prompt_target
  reference_mode: first_frame
  env:
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  generation:
    # Production must use one resident pipeline per shard; never reload the
    # checkpoint between samples.
    require_persistent_batch: true
    # One upstream block contains three latents and decodes to about 12 frames.
    # Five blocks produce a benchmark-friendly rollout of roughly five seconds.
    blocks: 5
    height: 704
    width: 1280
    fps: 12
    seed: 42
    increment_seed: true
    action_source: worldarena_camera_path
    vae_type: taew2_2
    # This workspace runs on Ampere A100 GPUs.  The upstream FP8/SageAttention3
    # path targets Blackwell, so use the portable BF16 + FlashAttention2 path.
    use_fp8_gemm: false
    quant_type: none
    encoder_device: cuda
    low_memory_threshold_gb: 40
    continue_on_error: true
    codec: libx264
    crf: 18
    preset: fast
  metadata:
    variant: ABot-World-0-5B-LF
    upstream_model_id: acvlab/ABot-World-0-5B-LF
    upstream_repository: https://github.com/amap-cvlab/ABot-World
    tested_upstream_revision: 39f55b9e665f31470fae40ea5622195b51063d96
    runtime_variant: a100_bf16_flash_attn_2

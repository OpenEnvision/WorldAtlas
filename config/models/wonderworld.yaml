model:
  name: wonderworld
  family: wonderworld
  backend_type: local_repo
  task_families: [video_generation, scene_3d_generation]
  artifact_types: [video, gaussian_splat, point_cloud]
  control_signals: [text, image, trajectory, camera_pose]
  roles: [candidate]
  # WonderWorld is run through a noninteractive batch path:
  # render benchmark frames, save the main prediction as MP4, and keep 3DGS files only as a sidecar archive.
  repo_root: thirdparty/WonderWorld
  entrypoint: run.py
  output_ext: .mp4
  supported_suites:
    - image_static
    - video_static
  prompt_mode: prompt_target
  reference_mode: first_frame
  generation:
    require_persistent_batch: true
    # Download the upstream RepViT SAM checkpoint under the unified ckpt root.
    repvit_checkpoint: ckpt/WonderWorld/repvit_sam.pt
    stable_diffusion_checkpoint: ckpt/sd2-community--stable-diffusion-2-inpainting
    depth_model_repo: ckpt/prs-eth--marigold-v1-0
    normal_model_repo: ckpt/prs-eth--marigold-normals-v0-1
    oneformer_model_repo: ckpt/huggingface/hub/models--shi-labs--oneformer_ade20k_swin_large/snapshots/4a5bac8e64f82681a12db2e151a4c2f4ce6092b2
    scene_name:
    entities:
    entity_limit: 3
    style_prompt:
    background_prompt: ""
    negative_prompt: ""
    seed: 1
    num_scenes: 1
    trajectory_frames: 50
    fps: 10
    use_gpt: false
    debug: false
    depth_model: marigold
    # Synthetic image_static translations inherit this model-native scene scale.
    # Override with synthetic_translation_scale only when using a custom reconstruction scale.
    camera_speed: 0.001
    fg_depth_range: 0.015
    depth_shift: 0.001
    sky_hard_depth: 0.02
    init_focal_length: 960
    inpainting_resolution_gen: 512
    inpainting_resolution_interp: 512
    gen_layer: false
    use_compile: false
    keep_work_dir: false
    archive_sidecars: true
    synthetic_focal_scale: 1.875
    # Fail generation when rendered frames collapse to WonderWorld's empty gray background.
    min_render_content_fraction: 0.02
    max_render_blank_frame_ratio: 0.2
  env:
    WORLDARENA_CHECKPOINT_ROOT: ckpt/

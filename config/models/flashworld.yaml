model:
  name: flashworld
  family: flashworld
  backend_type: local_repo
  task_families: [video_generation, scene_3d_generation]
  artifact_types: [video, gaussian_splat, point_cloud]
  control_signals: [text, image, camera_pose]
  roles: [candidate]
  # FlashWorld's released inference stack targets a newer CUDA/PyTorch environment than the repo default.
  # Place the upstream repo under thirdparty/ after preparing the conda environment externally.
  repo_root: /mnt/cpfs/yangboxue/visual_generation/juanxi/github_repos/FlashWorld
  # Keep FlashWorld's model.ckpt under the unified ckpt root.
  checkpoint_dir: /mnt/cpfs/yangboxue/visual_generation/juanxi/ckpt/FlashWorld
  python_bin: /mnt/cpfs/yangboxue/visual_generation/juanxi/conda/envs/flashworld/bin/python
  entrypoint: cli.py
  output_ext: .mp4
  supported_suites:
    - video_static
  prompt_mode: prompt_current
  reference_mode: first_frame
  generation:
    num_frames: 24
    image_height: 480
    image_width: 704
    image_index: 0
    video_fps: 15
    offload_t5: false
    offload_vae: false
    offload_transformer_during_vae: false
    export_ply: false
    export_spz: false
  env:
    FLASHWORLD_WAN_DIFFUSERS_MODEL_ID: /mnt/cpfs/yangboxue/visual_generation/juanxi/ckpt/Wan2.2-TI2V-5B-Diffusers

model:
  name: astra
  family: astra
  backend_type: local_repo
  task_families: [world_model, video_generation]
  artifact_types: [video]
  control_signals: [text, image, camera_pose]
  roles: [candidate]
  # Astra's current open-source inference path is image-conditioned camera motion.
  python_bin: /mnt/cpfs/yangboxue/visual_generation/juanxi/conda/envs/sana/bin/python
  repo_root: /mnt/cpfs/yangboxue/visual_generation/juanxi/github_repos/Astra
  checkpoint_dir: /mnt/cpfs/yangboxue/visual_generation/juanxi/ckpt/Astra
  entrypoint: scripts/infer_demo.py
  output_ext: .mp4
  supported_suites:
    - image_static
    - image_dynamic
    - video_static
    - video_dynamic
  prompt_mode: prompt_target
  reference_mode: first_frame
  generation:
    wan_model_path: /mnt/cpfs/yangboxue/visual_generation/juanxi/ckpt/Wan2.1-T2V-1.3B
    start_frame: 0
    initial_condition_frames: 1
    frames_per_generation: 8
    total_frames_to_generate: 24
    max_history_frames: 100
    device: cuda
    modality_type: sekai
    cam_type: 4
    cam_type_from_sample: true
    use_real_poses: false
    use_camera_cfg: false
    camera_guidance_scale: 2.0
    text_guidance_scale: 1.0
    moe_num_experts: 3
    moe_top_k: 1
    use_gt_prompt: false
    add_icons: false
    gpu_index: 0
  env:
    WORLDARENA_CHECKPOINT_ROOT: /mnt/cpfs/yangboxue/visual_generation/juanxi/ckpt
    HF_HOME: /mnt/cpfs/yangboxue/visual_generation/juanxi/conda/hf-home
    HUGGINGFACE_HUB_CACHE: /mnt/cpfs/yangboxue/visual_generation/juanxi/conda/hf-home/hub
    TORCH_HOME: /mnt/cpfs/yangboxue/visual_generation/juanxi/conda/torch-home
    XDG_CACHE_HOME: /mnt/cpfs/yangboxue/visual_generation/juanxi/conda/xdg-cache
    TOKENIZERS_PARALLELISM: "false"
    PYTHONPATH: "/mnt/cpfs/yangboxue/visual_generation/juanxi/WorldArena:/mnt/cpfs/yangboxue/visual_generation/juanxi/github_repos/Astra:/mnt/cpfs/yangboxue/visual_generation/juanxi/WorldArena/artifacts/runtime/astra_vendor"
    LD_LIBRARY_PATH: "/mnt/cpfs/yangboxue/visual_generation/juanxi/conda/envs/sana/lib:/usr/local/cuda-12.9/targets/x86_64-linux/lib:/usr/local/cuda-12.9/lib64:/usr/local/cuda/lib64"

model:
  name: hunyuan-gamecraft
  family: hunyuan_gamecraft
  backend_type: local_repo
  task_families: [world_model, video_generation]
  artifact_types: [video]
  control_signals: [text, image, actions]
  roles: [candidate]
  # Hunyuan-GameCraft ships a dedicated CUDA/PyTorch stack and should run in its own Python 3.10 environment.
  # Keep the upstream checkout under thirdparty/ or symlink it there.
  repo_root: thirdparty/Hunyuan-GameCraft-1.0
  # Keep the upstream weights layout under the unified ckpt root.
  checkpoint_dir: ckpt/tencent--Hunyuan-GameCraft-1.0
  entrypoint: hymm_sp/sample_batch.py
  output_ext: .mp4
  supported_suites:
    - image_static
    - image_dynamic
    - video_static
    - video_dynamic
  prompt_mode: prompt_target
  reference_mode: first_frame
  generation:
    model_variant: standard
    checkpoint_filename:
    num_gpus: 1
    master_port: 29605
    height: 704
    width: 1216
    cfg_scale: 2.0
    sample_n_frames: 33
    infer_steps: 50
    flow_shift_eval_video: 5.0
    seed: 42
    prompt_prefix: ""
    prompt_suffix: ""
    add_pos_prompt: ""
    add_neg_prompt: ""
    action_source: worldarena_camera_path
    action_speed: 0.2
    image_start: true
    cpu_offload: true
    disable_sp: true
    use_fp8: false
    use_sage: false
    use_deepcache: 1
    keep_work_dir: false
    action_plan:
      default:
        - w
        - d
        - w
        - a
        - w
      by_suite:
        image_static:
          - w
          - d
          - w
          - a
        image_dynamic:
          - w
          - d
          - w
          - a
          - w
        video_static:
          - w
          - d
          - w
          - a
        video_dynamic:
          - w
          - d
          - w
          - a
          - w

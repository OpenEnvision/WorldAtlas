model:
  name: lingbot-world-v2
  family: lingbot_world_v2
  backend_type: local_repo
  task_families: [world_model, video_generation]
  artifact_types: [video]
  control_signals: [text, image, trajectory]
  roles: [candidate]
  python_bin: ../conda/envs/lingbot-world-v2/bin/python
  repo_root: thirdparty/lingbot-world-v2
  checkpoint_dir: ckpt/lingbot-world-v2-14b-causal-fast
  entrypoint: generate.py
  output_ext: .mp4
  supported_suites:
    - image_static
    - image_dynamic
    - video_static
    - video_dynamic
  prompt_mode: prompt_target
  reference_mode: first_frame
  env:
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  generation:
    require_persistent_batch: true
    task: i2v-A14B
    size: 480*832
    conditioning_resize: 832*480
    frame_num: 81
    base_seed: 42
    sample_shift: 10.0
    infer_mode: causal_fast
    local_attn_size: 18
    sink_size: 6
    chunk_size: 3
    launcher: torchrun
    nproc_per_node: 8
    master_port: 29543
    ulysses_size: 8
    t5_fsdp: true
    dit_fsdp: true
    offload_model: false
  metadata:
    variant: v2-14b-causal-fast
    upstream_model_id: robbyant/lingbot-world-v2-14b-causal-fast

model:
  name: lingbot-world
  family: lingbot_world
  backend_type: local_repo
  task_families: [world_model, video_generation]
  artifact_types: [video]
  control_signals: [text, image, trajectory]
  roles: [candidate]
  # Place the upstream repo under thirdparty/ after preparing the conda environment externally.
  repo_root: thirdparty/lingbot-world
  python_bin: /share/project/yesliu/miniconda3/envs/lingbot-world/bin/python
  # /share/project/yesliu/hjd/model/tmp/lingbot-world/lingbot-world-base-cam
  # currently points to this canonical ckpt location.
  checkpoint_dir: ckpt/lingbot-world-base-cam
  entrypoint: generate.py
  output_ext: .mp4
  supported_suites:
    - image_static
    - image_dynamic
    - video_static
    - video_dynamic
  prompt_mode: prompt_target
  reference_mode: first_frame
  generation:
    # The adapter forwards the common upstream CLI controls directly from this block,
    # including sample_steps/sample_shift/sample_guide_scale, ulysses_size, t5_cpu,
    # t5_fsdp, dit_fsdp, use_prompt_extend, prompt_extend_*, and action_string_by_suite.
    task: i2v-A14B
    size: 832*480
    frame_num: 81
    base_seed: 42
    sample_solver: unipc
    offload_model: false
  metadata:
    variant: base_cam
    upstream_model_id: robbyant/lingbot-world-base-cam

model:
  name: infinite-world
  family: infinite_world
  backend_type: local_repo
  task_families: [world_model, video_generation]
  artifact_types: [video]
  control_signals: [text, image, actions]
  roles: [candidate]
  python_bin: /mnt/cpfs/yangboxue/visual_generation/juanxi/conda/envs/sana/bin/python
  repo_root: /mnt/cpfs/yangboxue/visual_generation/juanxi/ckpt/Infinite-World
  checkpoint_dir: /mnt/cpfs/yangboxue/visual_generation/juanxi/ckpt/Infinite-World
  entrypoint: scripts/infworld_inference.py
  output_ext: .mp4
  supported_suites:
    - image_static
    - image_dynamic
    - video_static
    - video_dynamic
  prompt_mode: prompt_target
  reference_mode: first_frame
  generation:
    config_path: configs/infworld_config.yaml
    bucket_config_name: ASPECT_RATIO_627_F64
    fps: 30
    seed: 42
    batch_size: 1
    num_chunks: 2
    num_sampling_steps: 30
    sample_shift: 7.0
    sample_guide_scale: 5.0
    quality: 8
    target_duration_sec: 5.0
    validation_num_frames: 81
    chunk_stride: 80
    action_source: worldarena_prompt
    action_plan:
      default:
        - forward
        - camera_right
        - forward
        - camera_left
        - forward
      by_suite:
        video_static:
          - forward
          - camera_right
          - forward
          - camera_left
          - forward
        video_dynamic:
          - forward
          - forward_right
          - camera_right
          - forward
          - camera_left
      frames_per_action: 16
  env:
    WORLDARENA_CHECKPOINT_ROOT: /mnt/cpfs/yangboxue/visual_generation/juanxi/ckpt
    HF_HOME: /mnt/cpfs/yangboxue/visual_generation/juanxi/conda/hf-home
    HUGGINGFACE_HUB_CACHE: /mnt/cpfs/yangboxue/visual_generation/juanxi/conda/hf-home/hub
    TORCH_HOME: /mnt/cpfs/yangboxue/visual_generation/juanxi/conda/torch-home
    XDG_CACHE_HOME: /mnt/cpfs/yangboxue/visual_generation/juanxi/conda/xdg-cache
    TOKENIZERS_PARALLELISM: "false"
    PYTHONPATH: "/mnt/cpfs/yangboxue/visual_generation/juanxi/WorldArena:/mnt/cpfs/yangboxue/visual_generation/juanxi/ckpt/Infinite-World"
    LD_LIBRARY_PATH: "/mnt/cpfs/yangboxue/visual_generation/juanxi/conda/envs/sana/lib:/usr/local/cuda-12.9/targets/x86_64-linux/lib:/usr/local/cuda-12.9/lib64:/usr/local/cuda/lib64"

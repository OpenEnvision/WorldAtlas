[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "worldarena"
version = "0.1.0"
description = "World model benchmark and dataset analytics toolkit"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "jinja2>=3.1",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "pandas>=2.2",
  "Pillow>=10.0",
  "plotly>=5.24",
  "PyYAML>=6.0",
  "tabulate>=0.9",
]

[project.optional-dependencies]
eval = [
  "torch>=2.4",
  "torchmetrics>=1.4",
  "torchvision>=0.19",
  "transformers>=4.44",
]
quality = [
  "pyiqa>=0.1.13",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
world_models = [
  "accelerate>=1.1.1",
  "av",
  "dashscope",
  "decord",
  "diffusers>=0.36.0",
  "easydict",
  "einops>=0.7.0",
  "ftfy",
  "huggingface-hub[cli]",
  "omegaconf",
  "safetensors>=0.4.3",
  "timm",
  "torch>=2.5.1",
  "torchaudio>=2.5.1",
  "torchvision>=0.20.1",
  "transformers>=4.49.0,<=4.57.3",
]

[project.scripts]
worldarena = "worldarena.cli:main"
worldarena-docs = "worldarena.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["worldarena"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".cache/pytest"

[tool.ruff]
line-length = 100
target-version = "py310"
cache-dir = ".cache/ruff"
